
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TATI COST — Beauty Business Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap');

:root {
  --ink: #49382f;
  --muted: #796c62;
  --paper: #f7f3ed;
  --white: #fffdf8;
  --line: #e5d9cc;
  --accent: #a5654d;
  --rose: #e9c8ba;
  --green: #667c61;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 14px 'DM Sans', Arial, sans-serif;
}

button, input, select { font: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }

h1, h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 500;
}

h1 { font-size: 36px; }
h2 { font-size: 26px; }
h3 { font-size: 16px; }
p { line-height: 1.65; }

aside {
  position: fixed;
  width: 245px;
  inset: 0 auto 0 0;
  background: #efe7dc;
  padding: 30px 20px;
  overflow: auto;
  border-right: 1px solid var(--line);
}

.brand {
  font: 36px 'Playfair Display', Georgia, serif;
  letter-spacing: -2px;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}

.nav {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px;
  border: 0;
  background: none;
  color: var(--muted);
  text-align: left;
  border-radius: 6px;
  margin: 4px 0;
}

.nav.active, .nav:hover {
  background: #e0cbb9;
  color: var(--ink);
}

.nav svg, .icon {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.navgroup { margin: 28px 0 10px; }

.foot {
  margin-top: 35px;
  border-top: 1px solid var(--line);
  padding-top: 20px;
  color: var(--muted);
  font-size: 12px;
}

main {
  margin-left: 245px;
  padding: 32px 40px;
  max-width: 1600px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 22px;
  margin-bottom: 28px;
}

.hero {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  align-items: center;
  background: #ead9c9;
  border: 1px solid #dfc9b6;
  min-height: 260px;
  padding: 30px 36px;
  overflow: hidden;
  margin-bottom: 30px;
}

.hero h1 {
  font-size: clamp(30px, 4vw, 54px);
  line-height: 1.12;
  margin: 12px 0;
}

.hero p {
  max-width: 420px;
  color: #725c4f;
  margin-bottom: 20px;
}

.hero svg {
  width: 100%;
  max-height: 260px;
}

.btn {
  border: 1px solid var(--ink);
  background: var(--ink);
  color: white;
  padding: 11px 17px;
  border-radius: 5px;
  font-weight: 600;
}

.btn:hover { opacity: .85; }

.secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}

.danger {
  color: #a3443d;
  background: transparent;
  border-color: #e5c4bd;
}

.smallbtn {
  padding: 6px 9px;
  font-size: 12px;
  margin: 2px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
  gap: 15px;
  margin: 18px 0 25px;
}

.card {
  background: var(--white);
  border: 1px solid var(--line);
  padding: 23px;
  margin-bottom: 18px;
  border-radius: 7px;
}

.grid .card { margin: 0; }

.metric {
  font: 34px 'Playfair Display', Georgia, serif;
  margin: 10px 0;
}

.muted, small { color: var(--muted); }
.green { color: var(--green); }
.red { color: #a3443d; }

.formgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 16px;
  margin: 18px 0;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
}

input, select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fffefa;
  padding: 11px;
  color: var(--ink);
}

input:focus, select:focus {
  outline: 2px solid var(--rose);
}

.tablewrap {
  overflow: auto;
  margin-top: 15px;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 470px;
}

td, th {
  text-align: left;
  padding: 13px 9px;
  border-bottom: 1px solid var(--line);
}

th {
  font-size: 11px;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--muted);
}

.empty {
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

.empty svg {
  display: block;
  width: 60px;
  height: 60px;
  margin: 0 auto 12px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.3;
}

.notice {
  padding: 14px 18px;
  background: #f0e6d9;
  border-left: 3px solid var(--accent);
  margin: 15px 0;
  line-height: 1.6;
}

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.ring {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--accent) var(--pct), #eadfd2 0);
  flex-shrink: 0;
}

.ring span {
  background: var(--white);
  width: 106px;
  height: 106px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 28px Georgia;
}

.row {
  display: flex;
  align-items: center;
  gap: 20px;
}

.bar {
  height: 12px;
  background: #eee3d7;
  display: flex;
  overflow: hidden;
  border-radius: 3px;
  margin: 15px 0;
}

.tag {
  display: inline-block;
  padding: 5px 9px;
  background: #eee3d7;
  font-size: 11px;
  border-radius: 3px;
}

.ok {
  background: #e0e9da;
  color: #50684b;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

#toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--ink);
  color: white;
  padding: 15px;
  z-index: 9;
  display: none;
}

#mobile { display: none; }

@media(max-width:800px) {
  aside {
    position: relative;
    width: 100%;
    padding: 18px;
  }

  #mobile {
    display: block;
    float: right;
  }

  #navs { display: none; }
  #navs.open { display: block; }
  .foot { display: none; }

  main {
    margin: 0;
    padding: 20px;
  }

  header { margin-bottom: 18px; }

  .hero {
    padding: 22px;
    grid-template-columns: 1.3fr 1fr;
  }

  .split { grid-template-columns: 1fr; }
  .grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .card { padding: 17px; }
  .metric { font-size: 28px; }
}

@media(max-width:420px) {
  .hero { grid-template-columns: 1fr; }
  .hero svg { max-height: 170px; }
  .row { gap: 12px; }
  .ring { width: 100px; height: 100px; }
  .ring span { width: 80px; height: 80px; }
}
</style>
</head>

<body>

<aside>
  <button id="mobile" class="btn secondary"
    onclick="document.querySelector('#navs').classList.toggle('open')">
    Menú
  </button>

  <div class="brand">tati cost.</div>
  <div class="eyebrow">Beauty Business Studio</div>

  <nav id="navs"></nav>

  <div class="foot">
    Tati Beauty Studio · Curicó<br>
    Tu brújula financiera<br><br>
    Innovación y Emprendimiento III<br>
    INACAP
  </div>
</aside>

<main>
  <header>
    <div>
      <div class="eyebrow">Tati Beauty Studio</div>
      <h2 id="heading"></h2>
    </div>
    <span class="tag">Mi estudio</span>
  </header>

  <div id="content"></div>
</main>

<div id="toast" role="status"></div>

<script>

const $ = id => document.getElementById(id);

const money = n => new Intl.NumberFormat('es-CL', {
  style: 'currency',
  currency: 'CLP',
  maximumFractionDigits: 0
}).format(n);

const dec = n => Number(n).toLocaleString('es-CL', {
  maximumFractionDigits: 2
});

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
}[c]));

const uid = () => Date.now().toString(36) +
  Math.random().toString(36).slice(2);

const fresh = () => ({
  servicios: [],
  insumos: [],
  gastos: [],
  mano: { mensual: 0, horas: 0 },
  baseHoras: 0,
  fichas: {}
});

let db = fresh();
let page = 'inicio';
let edit = '';
let selected = '';
let simId = '';

try {
  let x = localStorage.getItem('tatiCostV1');
  if (x) {
    const parsed = JSON.parse(x);
    if (valid(parsed)) db = parsed;
  }
} catch(e) {
  console.error(e);
}

const paths = {
  inicio: '<path d="M3 10l9-7 9 7v11H3zM9 21v-8h6v8"/>',
  servicios: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8 8l13 13M8 16L21 3"/>',
  insumos: '<path d="M3 7l9-4 9 4v13H3zM3 7l9 4 9-4M12 11v9"/>',
  mano: '<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',
  gastos: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  fichas: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M8 12l3 3 5-6"/>',
  simulador: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2m4 0h2M8 16h2m4 0h2"/>',
  rentabilidad: '<path d="M3 3v18h18M6 16l5-6 4 3 6-8"/>',
  config: '<circle cx="12" cy="12" r="4"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8l3 3M5 19l3-3m8-8l3-3"/>'
};

const icon = k => `
  <svg class="icon" viewBox="0 0 24 24">
    ${paths[k] || paths.fichas}
  </svg>
`;

const names = {
  inicio: 'Vista general',
  servicios: 'Servicios',
  insumos: 'Insumos',
  mano: 'Mano de obra',
  gastos: 'Gastos indirectos',
  fichas: 'Fichas de costos',
  simulador: 'Simulador de precios',
  rentabilidad: 'Rentabilidad',
  config: 'Configuración'
};

const illustration = `
<svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg">

  <path d="M75 263V125a115 115 0 0 1 230 0v138Z"
    fill="#d7b39d"/>

  <ellipse cx="190" cy="263" rx="170" ry="12"
    fill="#b78c76" opacity=".25"/>

  <rect x="110" y="125" width="70" height="137"
    rx="12" fill="#f7ecdc" stroke="#96745e"/>

  <rect x="125" y="99" width="40" height="30"
    rx="4" fill="#775344"/>

  <path d="M140 99V79h42v8h-28v12"
    fill="#775344"/>

  <rect x="119" y="164" width="52" height="62"
    fill="#d8b29a"/>

  <text x="145" y="187" text-anchor="middle"
    font-family="Georgia" font-size="15" fill="#604638">
    tati.
  </text>

  <text x="145" y="202" text-anchor="middle"
    font-size="6" letter-spacing="1" fill="#604638">
    BEAUTY STUDIO
  </text>

  <path d="M194 187h83v75h-83z"
    fill="#a16b53"/>

  <rect x="188" y="177" width="95" height="17"
    rx="4" fill="#664b3d"/>

  <rect x="204" y="211" width="63" height="32"
    fill="#ead7c1"/>

  <text x="235" y="230" text-anchor="middle"
    font-family="Georgia" font-size="11" fill="#604638">
    HAIR CARE
  </text>

  <g transform="translate(250 107) rotate(28)"
    stroke="#705145" stroke-width="5"
    fill="none" stroke-linecap="round">

    <circle cx="-15" cy="28" r="12"/>
    <circle cx="15" cy="28" r="12"/>

    <path d="M-8 19L23-55M8 19L-23-55"/>

    <circle cx="0" cy="0" r="3" fill="#705145"/>
  </g>

  <g fill="#9da387" stroke="#748066" stroke-width="1.5">

    <path d="M77 260Q40 150 65 60"
      fill="none" stroke-width="2"/>

    <path d="M59 112Q24 100 30 76Q57 81 59 112"/>

    <path d="M57 142Q88 121 88 101Q60 108 57 142"/>

    <path d="M62 176Q23 159 28 136Q57 142 62 176"/>

    <path d="M69 205Q101 182 98 165Q74 171 69 205"/>

  </g>

  <g transform="translate(298 207) rotate(14)">
    <rect width="28" height="56" rx="3"
      fill="#b58b71"/>
    <path d="M5 0V-32M11 0V-32M17 0V-32M23 0V-32"
      stroke="#775344" stroke-width="3"
      stroke-linecap="round"/>
  </g>

  <g stroke="#fff5e8" stroke-width="2" fill="none">
    <path d="M310 55v24M298 67h24"/>
    <path d="M90 36v16M82 44h16"/>
    <path d="M335 115v14M328 122h14"/>
  </g>

</svg>
`;

function save(msg) {
  try {
    localStorage.setItem('tatiCostV1', JSON.stringify(db));
    if (msg) toast(msg);
  } catch(e) {
    alert('No se pudieron guardar los datos.');
  }
}

function toast(s) {
  $('toast').textContent = s;
  $('toast').style.display = 'block';

  clearTimeout(window.tt);

  window.tt = setTimeout(() => {
    $('toast').style.display = 'none';
  }, 2500);
}

function go(p) {
  page = p;
  edit = '';
  render();
  $('navs').classList.remove('open');
  window.scrollTo(0,0);
}

function invalidate() {
  Object.values(db.fichas).forEach(f => {
    f.estado = 'En desarrollo';
  });
}

const labor = () => db.mano.horas
  ? db.mano.mensual / (60 * db.mano.horas)
  : 0;

const totalG = () => db.gastos.reduce(
  (a,g) => a + g.monto, 0
);

const ind = () => db.baseHoras
  ? totalG() / (60 * db.baseHoras)
  : 0;

function ficha(id) {
  return db.fichas[id] || {
    materiales: [],
    calidad: 'Estimados',
    estado: 'En desarrollo',
    confirmados: false
  };
}

function calc(s) {
  let f = ficha(s.id);

  let m = f.materiales.reduce((a,r) => {
    let i = db.insumos.find(i => i.id === r.insumo);

    return a + (i
      ? i.precio / i.cantidad * r.cantidad
      : 0);
  }, 0);

  let l = labor() * s.tiempo;
  let g = ind() * s.tiempo;
  let t = m + l + g;
  let r = s.precio - t;

  return {
    m, l, g, t, r,

    margin: s.precio > 0
      ? r / s.precio * 100
      : null,

    complete: !!(
      f.confirmados &&
      db.mano.horas > 0 &&
      db.baseHoras > 0 &&
      f.materiales.every(r =>
        db.insumos.some(i => i.id === r.insumo)
      ) &&
      ['Revisado','Validado'].includes(f.estado)
    )
  };
}

const card = (title,body) => `
  <section class="card">
    <h3>${title}</h3>
    ${body}
  </section>
`;

const metric = (label,value,k) => `
  <div class="card">
    ${icon(k)}
    <div class="metric">${value}</div>
    <small>${label}</small>
  </div>
`;

const table = (heads,rows) => rows.length
  ? `
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            ${heads.map(h => `<th>${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              ${r.map(c => `<td>${c}</td>`).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `
  : `
    <div class="empty">
      ${icon('fichas')}
      Aún no hay registros. Agrega el primero para comenzar.
    </div>
  `;

const field = (label,id,type='text',v='',attrs='') => `
  <div>
    <label for="${id}">${label}</label>
    <input id="${id}" type="${type}"
      value="${esc(v)}" ${attrs} required>
  </div>
`;

const select = (label,id,opts,v='') => `
  <div>
    <label for="${id}">${label}</label>
    <select id="${id}">
      ${opts.map(o => {
        let [k,t] = Array.isArray(o) ? o : [o,o];

        return `
          <option value="${esc(k)}"
            ${k === v ? 'selected' : ''}>
            ${esc(t)}
          </option>
        `;
      }).join('')}
    </select>
  </div>
`;

const form = (body,action,label='Guardar') => `
  <form onsubmit="event.preventDefault();${esc(action)}">
    <div class="formgrid">${body}</div>

    <div class="actions">
      <button class="btn">${label}</button>

      <button type="button" class="btn secondary"
        onclick="edit='';render()">
        Cancelar
      </button>
    </div>
  </form>
`;

const val = id => $(id).value;
const n = id => Number(val(id));

const opts = () => [
  ['', 'Seleccionar servicio'],
  ...db.servicios.map(s => [s.id,s.nombre])
];

const buttons = id => `
  <button class="btn secondary smallbtn"
    onclick="edit='${id}';render();window.scrollTo(0,0)">
    Editar
  </button>

  <button class="btn danger smallbtn"
    onclick="remove('${id}')">
    Eliminar
  </button>
`;

function nav() {
  const groups = [
    ['Mi estudio', ['inicio']],
    ['Administración', ['servicios','insumos','mano','gastos']],
    ['Finanzas', ['fichas','simulador','rentabilidad']],
    ['Sistema', ['config']]
  ];

  $('navs').innerHTML = groups.map(([title,items]) => `
    <div class="navgroup eyebrow">${title}</div>

    ${items.map(k => `
      <button class="nav ${page === k ? 'active' : ''}"
        onclick="go('${k}')">

        ${icon(k)}
        ${names[k]}
      </button>
    `).join('')}
  `).join('');
}

function costChart(ss) {
  let a = ss.reduce((a,s) => {
    let c = calc(s);

    return [
      a[0] + c.m,
      a[1] + c.l,
      a[2] + c.g
    ];
  }, [0,0,0]);

  let t = a.reduce((x,y) => x+y,0);

  let colors = [
    '#a5654d',
    '#d5aa91',
    '#7e8d71'
  ];

  return t ? `
    <div class="bar">
      ${a.map((v,j) => `
        <div style="width:${v/t*100}%;
          background:${colors[j]}">
        </div>
      `).join('')}
    </div>

    ${a.map((v,j) => `
      <div style="display:flex;
        justify-content:space-between;
        margin:10px 0">

        <span>
          <span style="color:${colors[j]}">●</span>
          ${['Materiales','Mano de obra','Indirectos'][j]}
        </span>

        <strong>${money(v)}</strong>
      </div>
    `).join('')}
  ` : `
    <div class="empty">
      ${icon('rentabilidad')}
      Sin costos registrados para graficar.
    </div>
  `;
}

function render() {

  nav();

  $('heading').textContent = names[page];

  let html = '';

  let s = db.servicios.find(x => x.id === edit);
  let i = db.insumos.find(x => x.id === edit);
  let g = db.gastos.find(x => x.id === edit);

  if (page === 'inicio') {

    const completed = db.servicios.filter(
      s => calc(s).complete
    );

    const coverage = db.servicios.length
      ? completed.length / db.servicios.length * 100
      : 0;

    const margins = completed.map(s => calc(s).margin)
      .filter(m => m !== null);

    const avg = margins.length
      ? margins.reduce((a,b) => a+b,0) / margins.length
      : null;

    const remaining = Math.max(
      0,
      Math.ceil(db.servicios.length * .8) - completed.length
    );

    html = `
      <section class="hero">
        <div>
          <div class="eyebrow">
            Tu brújula financiera
          </div>

          <h1>
            La belleza de conocer tus números.
          </h1>

          <p>
            Conoce el costo de cada servicio, cuida tus márgenes
            y toma mejores decisiones para tu estudio.
          </p>

          <button class="btn" onclick="go('servicios')">
            Mis servicios
          </button>
        </div>

        ${illustration}
      </section>

      <h3>Resumen de tu negocio</h3>

      <div class="grid">

        ${metric(
          'Servicios activos',
          db.servicios.length,
          'servicios'
        )}

        ${metric(
          'Servicios costeados',
          completed.length,
          'fichas'
        )}

        ${metric(
          'Margen promedio estimado',
          avg === null ? '—' : dec(avg)+'%',
          'rentabilidad'
        )}

        ${metric(
          'Insumos registrados',
          db.insumos.length,
          'insumos'
        )}

      </div>

      <div class="split">

        ${card('Tu camino hacia la meta', `
          <br>

          <div class="row">

            <div class="ring" style="--pct:${coverage}%">
              <span>${dec(coverage)}%</span>
            </div>

            <div>
              <strong>Objetivo: 80%</strong>

              <p class="muted">
                Costear los servicios activos
                en un plazo de tres meses.
              </p>

              <br>

              <small>
                ${!db.servicios.length
                  ? 'Registra tus servicios para comenzar.'
                  : coverage >= 80
                  ? 'Meta de cobertura alcanzada.'
                  : 'Faltan '+remaining+' servicios costeados.'}
              </small>
            </div>

          </div>
        `)}

        ${card(
          'Composición de costos de las fichas revisadas',
          costChart(completed)
        )}

      </div>

      ${card('Estado de tus servicios', table(
        ['Servicio','Precio','Estado'],
        db.servicios.map(s => [
          esc(s.nombre),
          money(s.precio),
          calc(s).complete
            ? '<span class="tag ok">Costeado</span>'
            : '<span class="tag">Pendiente</span>'
        ])
      ))}

      <div class="notice">
        <strong>Tu estudio, tus decisiones.</strong><br>
        Mantén actualizados los precios de compra y los costos
        de trabajo para conocer la rentabilidad estimada de
        tus servicios.
      </div>
    `;
  }

  if (page === 'servicios') {

    html = card(
      s ? 'Editar servicio' : 'Nuevo servicio',

      form(
        field('Nombre del servicio','nombre','text',s?.nombre) +

        select('Categoría','categoria',[
          'Peluquería',
          'Manicure',
          'Pedicure',
          'Masajes',
          'Depilación',
          'Otros'
        ],s?.categoria) +

        field(
          'Precio de venta ($)',
          'precio',
          'number',
          s?.precio,
          'min="0"'
        ) +

        field(
          'Duración (minutos)',
          'tiempo',
          'number',
          s?.tiempo,
          'min="1"'
        ),

        'store()',
        'Guardar servicio'
      )

    ) + card(
      'Catálogo de servicios',

      table(
        ['Servicio','Categoría','Precio','Duración','Acciones'],

        db.servicios.map(s => [
          esc(s.nombre),
          esc(s.categoria),
          money(s.precio),
          s.tiempo+' min',
          buttons(s.id)
        ])
      )
    );
  }

  if (page === 'insumos') {

    html = card(
      i ? 'Editar insumo' : 'Nuevo producto',

      form(
        field('Nombre del producto','nombre','text',i?.nombre) +

        field(
          'Precio de compra ($)',
          'precio',
          'number',
          i?.precio,
          'min="0"'
        ) +

        field(
          'Contenido total',
          'cantidad',
          'number',
          i?.cantidad,
          'min="0.01" step="any"'
        ) +

        select('Unidad de medida','unidad',[
          ['ml','Mililitros'],
          ['g','Gramos'],
          ['unidad','Unidades']
        ],i?.unidad),

        'store()',
        'Guardar insumo'
      )

    ) + card(
      'Catálogo de productos',

      table(
        ['Producto','Precio','Contenido','Costo unitario','Acciones'],

        db.insumos.map(i => [
          esc(i.nombre),
          money(i.precio),
          dec(i.cantidad)+' '+esc(i.unidad),
          '$'+dec(i.precio/i.cantidad),
          buttons(i.id)
        ])
      )

    ) + `
      <div class="notice">
        El costo unitario se calcula dividiendo el precio
        de compra por el contenido total del producto.
      </div>
    `;
  }

  if (page === 'mano') {

    html = card(
      'El valor de tu tiempo',

      form(
        field(
          'Costo mensual de mano de obra ($)',
          'mensual',
          'number',
          db.mano.horas ? db.mano.mensual : '',
          'min="0"'
        ) +

        field(
          'Horas productivas mensuales',
          'horas',
          'number',
          db.mano.horas || '',
          'min="0.01" step="any"'
        ),

        'db.mano={mensual:n("mensual"),horas:n("horas")};invalidate();save("Configuración guardada");render()'
      )

    ) + `
      <div class="grid">

        ${metric(
          'Costo por hora',
          db.mano.horas ? money(labor()*60) : '—',
          'mano'
        )}

        ${metric(
          'Costo por minuto',
          db.mano.horas ? '$'+dec(labor()) : '—',
          'mano'
        )}

      </div>

      <div class="notice">
        Tarifa promedio: costo mensual dividido por
        los minutos productivos del mismo período.
      </div>
    `;
  }

  if (page === 'gastos') {

    html = card(
      g ? 'Editar gasto' : 'Nuevo gasto mensual',

      form(
        field('Nombre','nombre','text',g?.nombre) +

        field(
          'Monto ($)',
          'monto',
          'number',
          g?.monto,
          'min="0"'
        ) +

        select('Tipo','tipo',[
          'Fijo',
          'Variable'
        ],g?.tipo),

        'store()'
      )

    ) + card(
      'Base de distribución',

      form(
        field(
          'Horas productivas mensuales del salón',
          'horas',
          'number',
          db.baseHoras || '',
          'min="0.01" step="any"'
        ),

        'db.baseHoras=n("horas");invalidate();save("Base guardada");render()'
      )

    ) + `
      <div class="grid">

        ${metric(
          'Gastos mensuales',
          money(totalG()),
          'gastos'
        )}

        ${metric(
          'Gasto por minuto',
          db.baseHoras ? '$'+dec(ind()) : '—',
          'mano'
        )}

      </div>

    ` + card(
      'Gastos registrados',

      table(
        ['Gasto','Tipo','Monto','Acciones'],

        db.gastos.map(g => [
          esc(g.nombre),
          esc(g.tipo),
          money(g.monto),
          buttons(g.id)
        ])
      )

    ) + `
      <div class="notice">
        Distribución propuesta según duración de cada servicio.
        Registra todos los gastos aplicables antes de revisar
        las fichas.
      </div>
    `;
  }

  if (page === 'fichas') {

    html = card('Selecciona un servicio', `
      <div class="formgrid">
        ${select('Servicio','pick',opts(),selected)}
      </div>
    `);

    let s = db.servicios.find(s => s.id === selected);

    if (s) {

      let f = ficha(s.id);
      let c = calc(s);

      html += card(
        'Materiales utilizados',

        form(
          select('Insumo','material',[
            ['', 'Seleccionar'],
            ...db.insumos.map(i => [
              i.id,
              i.nombre+' ('+i.unidad+')'
            ])
          ]) +

          field(
            'Cantidad utilizada',
            'cantidad',
            'number',
            '',
            'min="0.01" step="any"'
          ),

          'addMaterial()',
          'Agregar material'

        ) + table(
          ['Material','Cantidad','Costo','Acción'],

          f.materiales.map((m,j) => {

            let i = db.insumos.find(
              i => i.id === m.insumo
            );

            return [
              esc(i?.nombre || 'No disponible'),
              dec(m.cantidad)+' '+esc(i?.unidad),
              money(i ? i.precio/i.cantidad*m.cantidad : 0),

              `<button class="btn danger smallbtn"
                onclick="dropMaterial(${j})">
                Quitar
              </button>`
            ];
          })
        )

      ) + card(
        'Composición del costo',

        costChart([s]) +

        table(['Concepto','Monto'],[
          ['Materiales',money(c.m)],
          ['Mano de obra',money(c.l)],
          ['Indirectos',money(c.g)],
          ['<strong>Costo total estimado</strong>',
            '<strong>'+money(c.t)+'</strong>'],
          ['Precio de venta',money(s.precio)],
          ['Resultado estimado',money(c.r)],
          ['Margen sobre venta',
            c.margin === null ? '—' : dec(c.margin)+'%']
        ]) +

        (!c.complete
          ? `<div class="notice">
              Ficha pendiente de revisión;
              los costos pueden estar incompletos.
            </div>`
          : '')

      ) + card(
        'Revisión de la ficha',

        `
          <div class="formgrid">

            ${select('Calidad de datos','calidad',[
              'Estimados',
              'Parcialmente comprobados',
              'Comprobados'
            ],f.calidad)}

            ${select('Estado','estado',[
              'En desarrollo',
              'Revisado',
              'Validado'
            ],f.estado)}

          </div>

          <label>
            <input type="checkbox"
              id="confirmed"
              style="width:auto"
              ${f.confirmados ? 'checked' : ''}>

            Revisé todos los materiales,
            incluso si el servicio no requiere insumos.
          </label>

          <br>

          <button class="btn" onclick="review()">
            Guardar ficha
          </button>
        `
      );
    }
  }

  if (page === 'simulador') {

    let s = db.servicios.find(s => s.id === simId);

    html = card('Explora distintos precios', `

      <p class="muted">
        Evalúa diferentes escenarios sin modificar
        el precio actual de tus servicios.
      </p>

      <div class="formgrid">

        ${select('Servicio','simPick',opts(),simId)}

        ${field(
          'Precio simulado ($)',
          'simPrecio',
          'number',
          s?.precio,
          'min="0"'
        )}

        ${field(
          'Margen deseado (%)',
          'simMargen',
          'number',
          30,
          'min="0" max="99" step="any"'
        )}

      </div>

    `) + '<div id="simResult"></div>';
  }

  if (page === 'rentabilidad') {

    html = card(
      'Rentabilidad por servicio',

      table(
        ['Servicio','Precio','Costo','Resultado','Margen','Estado'],

        db.servicios.map(s => {

          let c = calc(s);

          return [
            esc(s.nombre),
            money(s.precio),
            c.complete ? money(c.t) : 'Pendiente',
            c.complete ? money(c.r) : '—',

            c.complete && c.margin !== null
              ? `<strong class="${c.margin<0?'red':'green'}">
                  ${dec(c.margin)}%
                </strong>`
              : '—',

            esc(ficha(s.id).estado)
          ];
        })
      )

    ) + `
      <div class="notice">
        Los resultados son estimaciones por servicio,
        no utilidad neta mensual.
      </div>
    `;
  }

  if (page === 'config') {

    html = card('Sobre TATI COST', `

      <br>

      <div class="eyebrow">Beauty Business Studio</div>

      <h2 style="margin:10px 0">
        Tu brújula financiera.
      </h2>

      <p>
        Una herramienta desarrollada para apoyar
        la gestión de costos y márgenes de Tati Beauty Studio.
      </p>

      <br>

      <small>
        Proyecto académico · Innovación y Emprendimiento III
        · INACAP Curicó.
      </small>

    `) + card('Tu información', `

      <br>

      <p>
        Los datos se almacenan en este navegador,
        no en una base de datos compartida.
      </p>

      <br>

      <div class="actions">

        <button class="btn" onclick="backup()">
          Descargar respaldo
        </button>

        <button class="btn secondary"
          onclick="$('import').click()">
          Importar respaldo
        </button>

        <input type="file" id="import"
          accept=".json"
          style="display:none"
          onchange="restore(event)">

      </div>

    `) + card('Reiniciar aplicación', `

      <br>

      <p>Elimina los datos locales de TATI COST.</p>

      <br>

      <button class="btn danger" onclick="resetData()">
        Eliminar datos
      </button>

    `);
  }

  $('content').innerHTML = html;

  if ($('pick')) {
    $('pick').onchange = () => {
      selected = val('pick');
      render();
    };
  }

  if ($('simPick')) {

    $('simPick').onchange = () => {
      simId = val('simPick');
      render();
    };

    $('simPrecio').oninput = simulate;
    $('simMargen').oninput = simulate;

    simulate();
  }
}

function store() {

  let id = edit || uid();
  let name = val('nombre').trim();

  if (!name) {
    alert('Ingresa un nombre válido.');
    return;
  }

  let x = {
    id,
    nombre: name
  };

  if (page === 'servicios') {

    Object.assign(x,{
      categoria: val('categoria'),
      precio: n('precio'),
      tiempo: n('tiempo')
    });

    if (db.fichas[id]) {
      db.fichas[id].estado = 'En desarrollo';
    }
  }

  if (page === 'insumos') {

    Object.assign(x,{
      precio: n('precio'),
      cantidad: n('cantidad'),
      unidad: val('unidad')
    });

    let old = db.insumos.find(i => i.id === id);

    if (
      old &&
      old.unidad !== x.unidad &&
      Object.values(db.fichas).some(f =>
        f.materiales.some(m => m.insumo === id)
      )
    ) {
      alert(
        'Retira el insumo de sus fichas antes de cambiar la unidad.'
      );
      return;
    }

    if (old) invalidate();
  }

  if (page === 'gastos') {

    Object.assign(x,{
      monto: n('monto'),
      tipo: val('tipo')
    });

    invalidate();
  }

  let arr = db[page];
  let j = arr.findIndex(x => x.id === id);

  if (j < 0) arr.push(x);
  else arr[j] = x;

  edit = '';

  save('Registro guardado');
  render();
}

function remove(id) {

  if (
    page === 'insumos' &&
    Object.values(db.fichas).some(f =>
      f.materiales.some(m => m.insumo === id)
    )
  ) {
    alert('Este insumo está asociado a una ficha.');
    return;
  }

  if (!confirm('¿Eliminar este registro?')) return;

  db[page] = db[page].filter(x => x.id !== id);

  if (page === 'servicios') {

    delete db.fichas[id];

    if (selected === id) selected = '';
    if (simId === id) simId = '';
  }

  if (page === 'gastos') invalidate();

  edit = '';

  save('Registro eliminado');
  render();
}

function addMaterial() {

  let id = val('material');
  let q = n('cantidad');

  if (!id || q <= 0 || !Number.isFinite(q)) {
    alert('Selecciona un insumo y una cantidad válida.');
    return;
  }

  let f = ficha(selected);

  let m = f.materiales.find(m => m.insumo === id);

  if (m) m.cantidad += q;
  else f.materiales.push({
    insumo: id,
    cantidad: q
  });

  f.confirmados = false;
  f.estado = 'En desarrollo';

  db.fichas[selected] = f;

  save('Material agregado');
  render();
}

function dropMaterial(j) {

  let f = ficha(selected);

  f.materiales.splice(j,1);

  f.confirmados = false;
  f.estado = 'En desarrollo';

  db.fichas[selected] = f;

  save();
  render();
}

function review() {

  let f = ficha(selected);

  let estado = val('estado');
  let calidad = val('calidad');
  let confirmados = $('confirmed').checked;

  if (
    estado !== 'En desarrollo' &&
    (!confirmados || !db.mano.horas || !db.baseHoras)
  ) {
    alert(
      'Completa materiales, mano de obra y base de gastos.'
    );
    return;
  }

  if (
    estado === 'Validado' &&
    calidad !== 'Comprobados'
  ) {
    alert('La validación requiere datos comprobados.');
    return;
  }

  Object.assign(f,{
    estado,
    calidad,
    confirmados,
    actualizado: new Date().toISOString()
  });

  db.fichas[selected] = f;

  save('Ficha guardada');
  render();
}

function simulate() {

  let s = db.servicios.find(s => s.id === simId);
  let out = $('simResult');

  if (!s) {

    out.innerHTML = `
      <div class="notice">
        Selecciona un servicio.
      </div>
    `;

    return;
  }

  let c = calc(s);

  if (!c.complete) {

    out.innerHTML = `
      <div class="notice">
        Completa y revisa la ficha antes de simular precios.
      </div>
    `;

    return;
  }

  let p = n('simPrecio');
  let m = n('simMargen');

  if (
    val('simPrecio') === '' ||
    val('simMargen') === '' ||
    !Number.isFinite(p) ||
    !Number.isFinite(m) ||
    p < 0 ||
    m < 0 ||
    m >= 100
  ) {

    out.innerHTML = `
      <div class="notice">
        Ingresa valores válidos.
      </div>
    `;

    return;
  }

  out.innerHTML = `

    <div class="grid">

      ${metric(
        'Costo total',
        money(c.t),
        'fichas'
      )}

      ${metric(
        'Resultado estimado',
        money(p-c.t),
        'rentabilidad'
      )}

      ${metric(
        'Margen simulado',
        p ? dec((p-c.t)/p*100)+'%' : '—',
        'rentabilidad'
      )}

      ${metric(
        'Precio para margen deseado',
        money(Math.ceil(c.t/(1-m/100))),
        'simulador'
      )}

    </div>

  ` + card('Lectura del escenario', `

    <br>

    <p>
      ${p < c.t
        ? 'El precio no cubre los costos estimados.'
        : p === c.t
        ? 'El precio cubre los costos sin margen positivo.'
        : 'El precio cubre los costos y genera un resultado positivo estimado.'}
    </p>

    <br>

    <small>
      La simulación no modifica el precio registrado.
    </small>

  `);
}

function backup() {

  let a = document.createElement('a');

  let url = URL.createObjectURL(
    new Blob(
      [JSON.stringify(db,null,2)],
      {type:'application/json'}
    )
  );

  a.href = url;
  a.download = 'TATI_COST_Respaldo.json';

  a.click();

  setTimeout(() => URL.revokeObjectURL(url),1000);
}

function valid(d) {

  let nn = x =>
    typeof x === 'number' &&
    Number.isFinite(x) &&
    x >= 0;

  let ids = a =>
    Array.isArray(a) &&

    a.every(x =>
      x &&
      typeof x.id === 'string' &&
      /^[a-z0-9]+$/.test(x.id) &&
      typeof x.nombre === 'string'
    ) &&

    new Set(a.map(x => x.id)).size === a.length;

  return d &&

    ids(d.servicios) &&
    ids(d.insumos) &&
    ids(d.gastos) &&

    d.servicios.every(s =>
      nn(s.precio) &&
      nn(s.tiempo) &&
      s.tiempo > 0
    ) &&

    d.insumos.every(i =>
      nn(i.precio) &&
      nn(i.cantidad) &&
      i.cantidad > 0 &&
      ['ml','g','unidad'].includes(i.unidad)
    ) &&

    d.gastos.every(g => nn(g.monto)) &&

    d.mano &&
    nn(d.mano.mensual) &&
    nn(d.mano.horas) &&
    nn(d.baseHoras) &&

    d.fichas &&
    typeof d.fichas === 'object' &&
    !Array.isArray(d.fichas) &&

    Object.entries(d.fichas).every(([id,f]) =>

      d.servicios.some(s => s.id === id) &&

      f &&
      Array.isArray(f.materiales) &&

      f.materiales.every(m =>
        nn(m.cantidad) &&
        m.cantidad > 0 &&
        d.insumos.some(i => i.id === m.insumo)
      ) &&

      ['En desarrollo','Revisado','Validado'].includes(f.estado) &&

      typeof f.confirmados === 'boolean'
    );
}

async function restore(e) {

  try {

    if (!e.target.files.length) return;

    let d = JSON.parse(
      await e.target.files[0].text()
    );

    if (!valid(d)) throw Error();

    if (confirm('¿Reemplazar los datos actuales?')) {

      db = d;
      edit = '';
      selected = '';
      simId = '';

      save('Respaldo importado');
      render();
    }

  } catch(err) {

    alert('Respaldo inválido.');
  }

  e.target.value = '';
}

function resetData() {

  if (!confirm('¿Eliminar todos los datos de TATI COST?')) {
    return;
  }

  db = fresh();

  edit = '';
  selected = '';
  simId = '';

  save('Datos eliminados');
  render();
}

render();

</script>
</body>
</html>
