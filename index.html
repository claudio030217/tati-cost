
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#842b50">
<title>TATI COST | Beauty & Finance</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --wine:#842b50;
  --dark:#60203c;
  --rose:#bc738c;
  --pink:#f2dce3;
  --light:#fcf3f5;
  --bg:#fbf8f7;
  --paper:#ffffff;
  --ink:#30252b;
  --muted:#8b747e;
  --line:#ead8df;
  --green:#527c65;
  --red:#b83e56;
  --shadow:0 4px 18px rgba(97,32,60,.06);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px 'DM Sans',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.5px}
h1{font-size:32px}
h2{font-size:25px}
h3{font-size:16px}
p{line-height:1.65}
small,.muted{color:var(--muted)}
.green{color:var(--green)}
.red{color:var(--red)}

.ico{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0;
}

aside{
  position:fixed;
  inset:0 auto 0 0;
  width:245px;
  background:linear-gradient(165deg,#923458,#60203c);
  color:white;
  padding:27px 17px;
  overflow:auto;
  z-index:90;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  font-weight:800;
  letter-spacing:.4px;
}

.brand .ico{
  width:35px;
  height:35px;
}

.brand-sub{
  font-size:10px;
  letter-spacing:2px;
  color:#e9bdce;
  margin:8px 0 25px;
}

.navgroup{
  margin:25px 12px 8px;
  color:#e6bbcc;
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-weight:700;
}

.nav{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  border:0;
  background:none;
  color:#f2dce5;
  text-align:left;
  padding:12px;
  border-radius:9px;
  margin:3px 0;
}

.nav.active,.nav:hover{
  background:#ffffff25;
  color:white;
}

.foot{
  border-top:1px solid #ffffff30;
  margin-top:30px;
  padding:20px 10px;
  font-size:11px;
  line-height:1.9;
  color:#e8c4d2;
}

main{
  margin-left:245px;
  padding:30px 35px;
  max-width:1700px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:23px;
  padding-bottom:17px;
  border-bottom:1px solid var(--line);
}

.page-heading{
  display:flex;
  align-items:center;
  gap:13px;
}

.heading-icon{
  width:48px;
  height:48px;
  border-radius:12px;
  background:var(--pink);
  color:var(--wine);
  display:grid;
  place-items:center;
}

.heading-icon .ico{
  width:27px;
  height:27px;
}

.page-heading small{
  display:block;
  margin-top:3px;
}

.btn{
  background:linear-gradient(120deg,#983b60,#742343);
  border:1px solid transparent;
  border-radius:9px;
  color:white;
  padding:12px 17px;
  font-weight:700;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  transition:.15s;
}

.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}

.secondary{
  background:#fff9fb;
  color:var(--wine);
  border-color:#e6cbd6;
}

.danger{
  background:#fff4f5;
  color:var(--red);
  border-color:#edccd4;
}

.small{
  padding:7px 10px;
  font-size:12px;
}

.full{width:100%}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:13px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  color:#432b36;
  margin-bottom:10px;
}

.card h3 .ico{color:var(--wine)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
  margin:15px 0 22px;
}

.metric-card{
  background:linear-gradient(120deg,#f8e8ed,#efd7df);
  border:1px solid #edd2dc;
  border-radius:13px;
  padding:17px;
  display:flex;
  align-items:center;
  gap:14px;
  min-height:100px;
}

.metric-icon{
  width:48px;
  height:48px;
  background:#eac3d1;
  border-radius:12px;
  display:grid;
  place-items:center;
  color:var(--wine);
  flex-shrink:0;
}

.metric-icon .ico{
  width:26px;
  height:26px;
}

.metric-label{
  color:#62434f;
  font-size:12px;
  font-weight:700;
}

.metric-value{
  color:var(--dark);
  font-size:29px;
  font-weight:800;
  letter-spacing:-.7px;
  margin-top:4px;
}

.split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.actions{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
  gap:15px;
  margin:16px 0;
}

label{
  display:block;
  font-size:12px;
  color:#62434f;
  font-weight:700;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  min-height:44px;
  padding:11px 12px;
  border:1px solid #e8d3dc;
  border-radius:9px;
  background:#fdf9fa;
  color:var(--ink);
}

input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--rose);
  box-shadow:0 0 0 3px #f3dce5;
}

input[type=checkbox]{
  width:auto;
  min-height:auto;
  accent-color:var(--wine);
}

input[type=file]{font-size:12px}

.tablewrap{
  overflow:auto;
  margin-top:15px;
  border-radius:8px;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:470px;
  font-size:13px;
}

td,th{
  padding:12px 10px;
  border-bottom:1px solid #f0e4e8;
  text-align:left;
}

th{
  background:#f8edf1;
  color:var(--wine);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

tr:hover td{background:#fdf6f8}

.empty{
  padding:28px 12px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.empty .ico{
  display:block;
  margin:0 auto 12px;
  width:43px;
  height:43px;
  color:#c48da3;
}

.notice{
  background:#f7e9ee;
  border-left:3px solid var(--wine);
  color:#754c5d;
  padding:14px;
  border-radius:0 8px 8px 0;
  margin:15px 0;
  font-size:13px;
  line-height:1.65;
}

.tag{
  display:inline-block;
  background:#f3e0e7;
  color:var(--wine);
  padding:6px 9px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
}

.tag.ok{
  background:#e5efe8;
  color:#426b53;
}

.tag.warn{
  background:#f7dce3;
  color:#a03b50;
}

.finance-list{
  display:grid;
  gap:9px;
  margin:15px 0;
}

.finance-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:#fcf4f6;
  border:1px solid #f0e0e6;
  border-radius:10px;
  padding:14px;
}

.finance-icon{
  width:39px;
  height:39px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:#f0d5df;
  color:var(--wine);
  flex-shrink:0;
}

.description{flex:1;min-width:0}
.description strong{display:block;font-size:13px}
.description small{font-size:11px}

.amount{
  color:var(--dark);
  font-weight:800;
  font-size:15px;
  white-space:nowrap;
}

.total-card{
  background:linear-gradient(125deg,#9d4065,#762544);
  color:white;
  padding:22px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:15px;
  margin:16px 0;
}

.total-card .ico{
  width:37px;
  height:37px;
}

.total-card small{color:#f4dce6}
.total-card strong{display:block;font-size:30px;margin-top:4px}

.compare-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:16px 0;
}

.compare-card{
  background:#f5f0f1;
  border:1px solid #e8dce0;
  border-radius:12px;
  padding:17px;
}

.compare-card.after{
  background:#f3d6e0;
  border-color:#dfafc1;
}

.compare-card h3{
  justify-content:center;
  color:var(--wine);
}

.compare-subtitle{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  margin-bottom:15px;
}

.compare-line{
  display:flex;
  justify-content:space-between;
  gap:7px;
  border-top:1px solid #decbd3;
  padding:11px 0;
  font-size:12px;
}

.compare-line strong{color:var(--dark)}

.chart{
  margin:15px 0 5px;
}

.chart-body{
  display:flex;
  height:210px;
  gap:8px;
}

.axis{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  font-size:10px;
  color:var(--muted);
  padding-bottom:3px;
}

.chart-columns{
  flex:1;
  display:flex;
  justify-content:space-around;
  gap:12px;
  align-items:flex-end;
  border-bottom:1px solid #e7d4dc;
  background:repeating-linear-gradient(
    to top,
    transparent 0,
    transparent calc(25% - 1px),
    #eedfe5 calc(25% - 1px),
    #eedfe5 25%
  );
}

.chart-column{
  flex:1;
  max-width:90px;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
}

.chart-column strong{
  font-size:11px;
  color:var(--wine);
  margin-bottom:4px;
}

.column-fill{
  width:75%;
  border-radius:5px 5px 0 0;
  background:linear-gradient(to top,#842b50,#ce96ab);
}

.column-labels{
  display:flex;
  justify-content:space-around;
  gap:10px;
  margin:9px 0 0 30px;
}

.column-labels span{
  flex:1;
  max-width:90px;
  text-align:center;
  font-size:10px;
  color:var(--muted);
  overflow-wrap:anywhere;
}

.progress{
  height:13px;
  background:#f1e1e7;
  border-radius:20px;
  overflow:hidden;
  margin:14px 0;
}

.progress div{
  height:100%;
  background:linear-gradient(90deg,#d29aaf,#842b50);
  border-radius:20px;
}

.legend{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:10px 0;
}

.costbar{
  display:flex;
  height:15px;
  border-radius:8px;
  overflow:hidden;
  background:#f2e4e9;
  margin:16px 0;
}

.alert{
  display:flex;
  align-items:flex-start;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding:14px 0;
}

.alert .ico{color:var(--wine)}
.alert p{font-size:12px}

.servicehead{
  display:flex;
  align-items:center;
  gap:13px;
}

.servicephoto{
  width:58px;
  height:58px;
  border-radius:9px;
  object-fit:cover;
  background:var(--pink);
}

.service-avatar{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:var(--pink);
  color:var(--wine);
  flex-shrink:0;
}

.search{max-width:320px;margin:10px 0}

.welcome{
  display:flex;
  align-items:center;
  gap:15px;
  background:linear-gradient(120deg,#f7e5eb,#fff9fa);
  border:1px solid var(--line);
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
}

.welcome-text{flex:1}

.welcome h2{
  color:var(--dark);
  font-size:23px;
  margin:7px 0;
}

.welcome p{font-size:12px;color:#82616f}
.welcome svg.art{width:150px;flex-shrink:0}

#toast{
  display:none;
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--dark);
  color:white;
  padding:15px 20px;
  border-radius:10px;
  z-index:150;
  box-shadow:0 5px 25px #61203c30;
}

#mobile,.bottom-nav{display:none}

@media(max-width:850px){

  body{
    padding-bottom:calc(75px + env(safe-area-inset-bottom));
  }

  aside{
    position:sticky;
    top:0;
    width:100%;
    padding:13px 18px;
    overflow:visible;
    background:linear-gradient(110deg,#923458,#742343);
  }

  .brand{
    font-size:21px;
    justify-content:center;
  }

  .brand .ico{
    width:30px;
    height:30px;
  }

  .brand-sub,.foot{display:none}

  #mobile{
    display:block;
    float:right;
    background:none;
    color:white;
    border:0;
    padding:4px;
  }

  #navs{display:none}

  #navs.open{
    display:block;
    max-height:70vh;
    overflow:auto;
    margin-top:15px;
  }

  main{
    margin:0;
    padding:15px 13px;
  }

  header{
    padding-bottom:12px;
    margin-bottom:14px;
  }

  header>.tag{display:none}
  header h2{font-size:22px}

  .heading-icon{
    width:36px;
    height:36px;
    background:none;
  }

  .page-heading{gap:9px}
  .page-heading small{font-size:11px}

  .grid{
    grid-template-columns:1fr;
    gap:9px;
    margin:12px 0 17px;
  }

  .metric-card{
    min-height:78px;
    padding:12px;
  }

  .metric-value{font-size:25px}
  .metric-icon{width:45px;height:45px}

  .split{grid-template-columns:1fr;gap:0}
  .card{padding:15px;margin-bottom:12px}
  .formgrid{grid-template-columns:1fr;gap:13px}
  input,select,textarea{font-size:16px}

  form .actions .btn{flex:1}

  .finance-row{padding:11px;gap:9px}
  .finance-icon{width:34px;height:34px}
  .amount{font-size:13px}

  .compare-card{padding:11px}
  .compare-line{font-size:11px}
  .total-card{padding:18px}
  .total-card strong{font-size:27px}

  .welcome{padding:15px}
  .welcome h2{font-size:20px}
  .welcome svg.art{width:105px}

  .bottom-nav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:100;
    background:#fffafb;
    border-top:1px solid var(--line);
    padding:8px 5px;
    padding-bottom:max(9px,env(safe-area-inset-bottom));
  }

  .bottom-nav button{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    border:0;
    background:none;
    color:#a58b97;
    font-size:10px;
    font-weight:700;
    padding:7px 2px;
    border-radius:9px;
  }

  .bottom-nav button.active{
    background:#f5e3ea;
    color:var(--wine);
  }

  #toast{
    bottom:90px;
    left:12px;
    right:12px;
    text-align:center;
  }
}

@media print{
  aside,header,.bottom-nav,.btn,.noprint,#toast{
    display:none!important;
  }

  body{background:white;padding:0}
  main{margin:0;padding:0}
  .card{box-shadow:none;break-inside:avoid}
  table{min-width:0}
}

</style>
</head>

<body>

<aside>
  <button id="mobile" aria-label="Abrir menú"
    onclick="document.getElementById('navs').classList.toggle('open')">
    ☰
  </button>

  <div class="brand" id="brand">TATI COST</div>
  <div class="brand-sub">BEAUTY & FINANCE</div>

  <nav id="navs"></nav>

  <div class="foot">
    TATI BEAUTY STUDIO<br>
    Curicó, Chile<br><br>
    Tu brújula financiera<br>
    Versión 4.0
  </div>
</aside>

<main>
  <header id="header"></header>
  <div id="content"></div>
</main>

<nav class="bottom-nav" id="bottomNav"></nav>
<div id="toast" role="status"></div>

<script>

'use strict';

const $=id=>document.getElementById(id);

const money=n=>Number(n).toLocaleString('es-CL',{
  style:'currency',
  currency:'CLP',
  maximumFractionDigits:0
});

const dec=n=>Number(n).toLocaleString('es-CL',{
  maximumFractionDigits:2
});

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[c]));

const uid=()=>Date.now().toString(36)+
  Math.random().toString(36).slice(2,9);

const now=()=>new Date().toISOString();

function fmtdate(d){
  if(!d)return 'Sin fecha';
  const v=new Date(
    /^\d{4}-\d{2}-\d{2}$/.test(d)
      ? d+'T12:00:00'
      : d
  );
  return Number.isNaN(v.getTime())
    ? 'Sin fecha'
    : v.toLocaleDateString('es-CL');
}

const paths={
  inicio:'<path d="M3 10l9-7 9 7v11H3zM9 21v-8h6v8"/>',
  servicios:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8 8l13 13M8 16L21 3"/>',
  insumos:'<path d="M3 7l9-4 9 4v13H3zM3 7l9 4 9-4M12 11v9"/>',
  mano:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',
  gastos:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  fichas:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M7 6h10M7 11h2m6 0h2M7 15h2m6 0h2M7 19h2m6 0h2"/>',
  simulador:'<path d="M3 3h9l9 9-9 9-9-9z"/><circle cx="8" cy="8" r="1.5"/>',
  rentabilidad:'<path d="M3 3v18h18M6 17v-5h3v5M12 17V8h3v9M18 17V4h3v13"/>',
  asistente:'<path d="M9 18h6M10 22h4M8 15c-6-6-2-13 4-13s10 7 4 13l-1 3H9z"/>',
  informes:'<path d="M5 2h10l4 4v16H5zM14 2v6h5M8 12h8M8 16h8"/>',
  historial:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2M2 3v6h6"/>',
  config:'<circle cx="12" cy="12" r="4"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8l3 3M5 19l3-3m8-8l3-3"/>',
  coins:'<ellipse cx="9" cy="5" rx="6" ry="3"/><path d="M3 5v5c0 4 12 4 12 0V5M3 10v5c0 4 12 4 12 0v-5"/><ellipse cx="17" cy="15" rx="5" ry="3"/><path d="M12 15v4c0 4 10 4 10 0v-4"/>',
  percent:'<circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M20 4L4 20"/>',
  person:'<circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>',
  save:'<path d="M3 3h15l3 3v15H3zM7 3v7h10V3M7 21v-7h10v7"/>',
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
  logo:'<path d="M3 21v-7h4v7M10 21V10h4v11M17 21V5h4v16M2 10l7-5 5 1 7-4M16 2h5v5"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="M7 12l3 3 7-7"/>',
  sparkle:'<path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>'
};

const icon=k=>`
  <svg class="ico" viewBox="0 0 24 24">
    ${paths[k]||paths.fichas}
  </svg>
`;

const names={
  inicio:'Inicio',
  servicios:'Mis servicios',
  insumos:'Productos e insumos',
  mano:'Mano de obra',
  gastos:'Gastos indirectos',
  fichas:'Calculadora de costos',
  simulador:'Simulador de precios',
  rentabilidad:'Rentabilidad',
  asistente:'Asistente financiero',
  informes:'Informes',
  historial:'Historial',
  config:'Configuración'
};

const subtitles={

function migrate(d){

  if(!d||
    !Array.isArray(d.servicios)||
    !Array.isArray(d.insumos)||
    !Array.isArray(d.gastos)||
    !d.mano||
    !d.fichas
  )throw Error('Formato inválido');

  d.config={...fresh().config,...d.config};

  d.historial=Array.isArray(d.historial)
    ?d.historial:[];

  d.simulaciones=Array.isArray(d.simulaciones)
    ?d.simulaciones:[];

  d.servicios=d.servicios.map(s=>({
    activo:true,
    preparacion:0,
    limpieza:0,
    foto:'',
    ...s,
    atencion:s.atencion??Math.max(
      0,
      s.tiempo-(s.preparacion||0)-(s.limpieza||0)
    )
  }));

  d.insumos=d.insumos.map(i=>({
    proveedor:'',
    stock:null,
    minimo:null,
    historial:[],
    ...i
  }));

  return d;
}

function valid(d){

  const nn=x=>typeof x==='number'&&
    Number.isFinite(x)&&x>=0;

  const ids=a=>Array.isArray(a)&&
    a.every(x=>x&&
      typeof x.nombre==='string'&&
      typeof x.id==='string'&&
      /^[a-zA-Z0-9_-]+$/.test(x.id)
    )&&new Set(a.map(x=>x.id)).size===a.length;

  return d&&
    ids(d.servicios)&&
    ids(d.insumos)&&
    ids(d.gastos)&&

    d.servicios.every(s=>
      nn(s.precio)&&
      nn(s.tiempo)&&s.tiempo>0&&
      nn(s.preparacion)&&
      nn(s.atencion)&&
      nn(s.limpieza)&&
      typeof s.activo==='boolean'&&
      Math.abs(
        s.tiempo-s.preparacion-s.atencion-s.limpieza
      )<.001
    )&&

    d.insumos.every(i=>
      nn(i.precio)&&
      nn(i.cantidad)&&i.cantidad>0&&
      ['ml','g','unidad'].includes(i.unidad)&&
      (i.stock===null||nn(i.stock))&&
      (i.minimo===null||nn(i.minimo))&&
      Array.isArray(i.historial)&&
      i.historial.every(h=>
        h&&nn(h.anterior)&&nn(h.nuevo)
      )
    )&&

    d.gastos.every(g=>nn(g.monto))&&

    nn(d.mano.mensual)&&
    nn(d.mano.horas)&&
    nn(d.baseHoras)&&

    nn(d.config.margen)&&
    d.config.margen<100&&
    nn(d.config.meta)&&
    d.config.meta>0&&
    d.config.meta<=100&&
    nn(d.config.revision)&&
    d.config.revision>0&&

    d.fichas&&
    typeof d.fichas==='object'&&
    !Array.isArray(d.fichas)&&

    Object.entries(d.fichas).every(([id,f])=>
      d.servicios.some(s=>s.id===id)&&
      f&&Array.isArray(f.materiales)&&
      typeof f.confirmados==='boolean'&&
      ['En desarrollo','Revisado','Validado']
        .includes(f.estado)&&
      ['Estimados','Parcialmente comprobados','Comprobados']
        .includes(f.calidad)&&
      f.materiales.every(m=>
        m&&nn(m.cantidad)&&m.cantidad>0&&
        d.insumos.some(i=>i.id===m.insumo)
      )
    )&&

    Array.isArray(d.historial)&&
    d.historial.every(h=>
      h&&typeof h.texto==='string'
    )&&

    Array.isArray(d.simulaciones)&&
    d.simulaciones.every(s=>
      s&&typeof s.servicio==='string'&&
      nn(s.precioSimulado)&&
      nn(s.costoSimulado)&&
      (s.margen===null||Number.isFinite(s.margen))
    );
}

const labor=()=>db.mano.horas
  ?db.mano.mensual/(60*db.mano.horas)
  :0;

const totalG=()=>db.gastos.reduce(
  (a,g)=>a+g.monto,0
);

const indirect=()=>db.baseHoras
  ?totalG()/(60*db.baseHoras)
  :0;

const active=()=>db.servicios.filter(s=>s.activo);

const ficha=id=>db.fichas[id]||{
  materiales:[],
  calidad:'Estimados',
  estado:'En desarrollo',
  confirmados:false
};

function calc(s){

  const f=ficha(s.id);

  const m=f.materiales.reduce((a,r)=>{

    const i=db.insumos.find(
      i=>i.id===r.insumo
    );

    return a+(i
      ?i.precio/i.cantidad*r.cantidad
      :0);

  },0);

  const l=labor()*s.tiempo;
  const g=indirect()*s.tiempo;
  const t=m+l+g;

  return{
    m,l,g,t,
    r:s.precio-t,

    margin:s.precio>0
      ?(s.precio-t)/s.precio*100
      :null,

    complete:!!(
      f.confirmados&&
      db.mano.horas>0&&
      db.baseHoras>0&&
      f.materiales.every(r=>
        db.insumos.some(i=>i.id===r.insumo)
      )&&
      ['Revisado','Validado'].includes(f.estado)
    )
  };
}

function verticalChart(){

  const ss=completed()
    .filter(s=>calc(s).margin!==null)
    .sort((a,b)=>calc(b).margin-calc(a).margin)
    .slice(0,5);

  if(!ss.length){
    return empty('Completa las fichas para visualizar la rentabilidad.');
  }

  const max=Math.max(
    60,
    Math.ceil(Math.max(...ss.map(s=>
      Math.max(0,calc(s).margin)
    ))/20)*20
  );

  return`
    <div class="chart">

      <div class="chart-body">

        <div class="axis">
          ${[1,.75,.5,.25,0].map(v=>`
            <span>${dec(max*v)}%</span>
          `).join('')}
        </div>

        <div class="chart-columns">

          ${ss.map((s,j)=>{

            const m=calc(s).margin;

            return`
              <div class="chart-column"
                title="${esc(s.nombre)}: ${dec(m)}%">

                <strong style="color:${m<0?'#b83e56':'#842b50'}">
                  ${dec(m)}%
                </strong>

                <div class="column-fill"
                  style="height:${Math.max(0,m/max*100)}%;
                  opacity:${.6+j*.1}">
                </div>

              </div>
            `;

          }).join('')}

        </div>

      </div>

      <div class="column-labels">
        ${ss.map(s=>`<span>${esc(s.nombre)}</span>`).join('')}
      </div>

      <br>
      <small>Hasta cinco servicios con mayor margen estimado.
      Los márgenes negativos se indican en rojo.</small>

    </div>
  `;
}

function costChart(ss){

  const a=ss.reduce((a,s)=>{
    const c=calc(s);
    return[a[0]+c.m,a[1]+c.l,a[2]+c.g];
  },[0,0,0]);

  const t=a.reduce((x,y)=>x+y,0);

  const colors=['#842b50','#d69bad','#b7a0aa'];

  if(!t)return empty('Sin costos disponibles.');

  return`
    <div class="costbar">
      ${a.map((v,j)=>`
        <div style="width:${v/t*100}%;
          background:${colors[j]}">
        </div>
      `).join('')}
    </div>

    ${a.map((v,j)=>`
      <div class="legend">
        <span>
          <span style="color:${colors[j]}">●</span>
          ${['Materiales','Mano de obra','Indirectos'][j]}
        </span>
        <strong>${money(v)}</strong>
      </div>
    `).join('')}
  `;
}

function alerts(){

  const a=[];

  active().forEach(s=>{

    const c=calc(s);
    const f=ficha(s.id);

    if(!c.complete){

      a.push({
        title:'Ficha pendiente',
        text:s.nombre+' necesita completar o revisar sus costos.',
        page:'fichas',
        id:s.id
      });

    }else{

      if(c.r<0){

        a.push({
          title:'Pérdida estimada',
          text:s.nombre+': '+money(c.r)+' por servicio.',
          page:'fichas',
          id:s.id
        });

      }else if(c.margin!==null&&c.margin<db.config.margen){

        a.push({
          title:'Margen inferior al objetivo',
          text:s.nombre+': '+dec(c.margin)+'%. Precio sugerido: '+
            money(Math.ceil(c.t/(1-db.config.margen/100))),
          page:'fichas',
          id:s.id
        });
      }

      if(f.actualizado&&
        Date.now()-new Date(f.actualizado).getTime()>
        db.config.revision*86400000
      ){

        a.push({
          title:'Revisión de costos pendiente',
          text:s.nombre+' requiere actualizar su ficha.',
          page:'fichas',
          id:s.id
        });
      }
    }
  });

  db.insumos.forEach(i=>{

    if(i.stock!==null&&i.minimo!==null&&i.stock<=i.minimo){

      a.push({
        title:'Stock bajo',
        text:i.nombre+': '+dec(i.stock)+' '+i.unidad+' disponibles.',
        page:'insumos',
        id:i.id
      });
    }

    const last=i.historial[0];

    if(last&&last.nuevo>last.anterior){

      a.push({
        title:'Aumento del costo unitario',
        text:i.nombre+': '+(
          last.anterior>0
            ?dec((last.nuevo/last.anterior-1)*100)+'% de aumento.'
            :'Nuevo costo superior al anterior.'
        ),
        page:'insumos',
        id:i.id
      });
    }
  });

  return a;
}

async function readPhoto(e){

  const file=e.target.files[0];

  if(!file)return;

  if(file.size>3*1024*1024||
    !['image/jpeg','image/png','image/webp'].includes(file.type)
  ){
    alert('Selecciona una imagen JPG, PNG o WebP de hasta 3 MB.');
    return;
  }

  const status=$('photoStatus');

  status.textContent='Procesando fotografía...';
  photoLoading=true;

  let url='';

  try{

    url=URL.createObjectURL(file);

    const img=new Image();

    await new Promise((resolve,reject)=>{
      img.onload=resolve;
      img.onerror=reject;
      img.src=url;
    });

    const canvas=document.createElement('canvas');

    const scale=Math.min(
      1,500/Math.max(img.width,img.height)
    );

    canvas.width=Math.max(
      1,Math.round(img.width*scale)
    );

    canvas.height=Math.max(
      1,Math.round(img.height*scale)
    );

    const ctx=canvas.getContext('2d');

    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(
      img,0,0,canvas.width,canvas.height
    );

    if(status.isConnected){

      pendingPhoto=canvas.toDataURL('image/jpeg',.75);

      status.textContent='Fotografía preparada. Guarda el servicio.';
    }

  }catch(err){

    if(status.isConnected){
      status.textContent='No fue posible procesar la imagen.';
    }

  }finally{

    if(url)URL.revokeObjectURL(url);

    if(status.isConnected)photoLoading=false;
  }
}

function store(){

  if(storageError)return alert('Importa un respaldo válido.');
  if(photoLoading)return alert('Espera que se procese la fotografía.');

  const id=edit||uid();
  const name=val('nombre').trim();

  if(!name){
    alert('Ingresa un nombre válido.');
    return;
  }

  const old=db[page].find(x=>x.id===id);

  let x={...old,id,nombre:name};

  if(page==='servicios'){

    const prep=n('preparacion');
    const att=n('atencion');
    const clean=n('limpieza');

    if(prep+att+clean<=0){
      alert('La duración total debe ser mayor que cero.');
      return;
    }

    Object.assign(x,{

      categoria:val('categoria'),
      precio:n('precio'),
      preparacion:prep,
      atencion:att,
      limpieza:clean,
      tiempo:prep+att+clean,
      activo:val('activo')==='true',

      foto:pendingPhoto!==null
        ?pendingPhoto
        :old?.foto||''

    });

    if(old&&(
      old.precio!==x.precio||
      old.tiempo!==x.tiempo
    )){
      invalidate(id);
    }
  }

  if(page==='insumos'){

    Object.assign(x,{

      proveedor:val('proveedor').trim(),
      precio:n('precio'),
      cantidad:n('cantidad'),
      unidad:val('unidad'),

      stock:val('stock')===''
        ?null:n('stock'),

      minimo:val('minimo')===''
        ?null:n('minimo'),

      historial:old?.historial||[]

    });

    if(old&&old.unidad!==x.unidad&&
      Object.values(db.fichas).some(f=>
        f.materiales.some(m=>m.insumo===id)
      )
    ){
      alert('Retira el producto de sus fichas antes de cambiar la unidad.');
      return;
    }

    if(old){

      const anterior=old.precio/old.cantidad;
      const nuevo=x.precio/x.cantidad;

      if(old.unidad===x.unidad&&anterior!==nuevo){

        x.historial.unshift({
          fecha:now(),
          anterior,
          nuevo
        });

        invalidateInput(id);
      }

      if(old.unidad!==x.unidad)x.historial=[];
    }
  }

  if(page==='gastos'){

    Object.assign(x,{
      monto:n('monto'),
      tipo:val('tipo')
    });

    invalidate();
  }

  const j=db[page].findIndex(x=>x.id===id);

  if(j<0)db[page].push(x);
  else db[page][j]=x;

  log((old?'Actualización: ':'Nuevo registro: ')+name);

  edit='';
  pendingPhoto=null;

  save('Registro guardado');
  render();
}

function remove(id){

  if(storageError)return;

  if(page==='insumos'&&
    Object.values(db.fichas).some(f=>
      f.materiales.some(m=>m.insumo===id)
    )
  ){
    alert('Este producto está asociado a una ficha de costos.');
    return;
  }

  const x=db[page].find(x=>x.id===id);

  if(!x||!confirm('¿Eliminar '+x.nombre+'?'))return;

  db[page]=db[page].filter(x=>x.id!==id);

  if(page==='servicios'){

    delete db.fichas[id];

    if(selected===id)selected='';
    if(simId===id)simId='';
  }

  if(page==='gastos')invalidate();

  log('Registro eliminado: '+x.nombre);

  edit='';

  save('Registro eliminado');
  render();
}

function saveLabor(){

  if(storageError)return;

  db.mano={
    mensual:n('mensual'),
    horas:n('horas')
  };

  invalidate();

  log('Actualización del costo de mano de obra');

  save('Mano de obra guardada');
  render();
}

function saveBase(){

  if(storageError)return;

  db.baseHoras=n('horas');

  invalidate();

  log('Actualización de la base de gastos indirectos');

  save('Base guardada');
  render();
}

function addMaterial(){

  if(storageError)return;

  const id=val('material');
  const q=n('cantidad');

  if(!id||!Number.isFinite(q)||q<=0){
    alert('Selecciona un producto y una cantidad válida.');
    return;
  }

  const f=ficha(selected);

  const m=f.materiales.find(m=>m.insumo===id);

  if(m)m.cantidad+=q;
  else f.materiales.push({
    insumo:id,
    cantidad:q
  });

  f.confirmados=false;
  f.estado='En desarrollo';

  db.fichas[selected]=f;

  log('Material agregado a ficha de '+
    db.servicios.find(s=>s.id===selected).nombre
  );

  save('Material agregado');
  render();
}

function dropMaterial(j){

  if(storageError)return;

  const f=ficha(selected);

  f.materiales.splice(j,1);
  f.confirmados=false;
  f.estado='En desarrollo';

  db.fichas[selected]=f;

  log('Material retirado de una ficha');

  save('Material retirado');
  render();
}

function review(){

  if(storageError)return;

  const f=ficha(selected);

  const estado=val('estado');
  const calidad=val('calidad');
  const confirmados=$('confirmed').checked;

  if(estado!=='En desarrollo'&&
    (!confirmados||!db.mano.horas||!db.baseHoras)
  ){
    alert('Completa la revisión de materiales, mano de obra y gastos indirectos.');
    return;
  }

  if(estado==='Validado'&&calidad!=='Comprobados'){
    alert('La validación requiere datos comprobados.');
    return;
  }

  Object.assign(f,{
    estado,
    calidad,
    confirmados,
    actualizado:now()
  });

  db.fichas[selected]=f;

  log('Ficha '+estado.toLowerCase()+': '+
    db.servicios.find(s=>s.id===selected).nombre
  );

  save('Ficha guardada');
  render();
}

function simulationData(){

  const s=active().find(s=>s.id===simId);

  if(!s||!calc(s).complete)return null;

  const c=calc(s);

  const p=n('simPrecio');
  const m=n('simMargen');
  const variation=n('simCosto');

  if(
    ['simPrecio','simMargen','simCosto']
      .some(id=>val(id)==='')||

    ![p,m,variation].every(Number.isFinite)||

    p<0||
    m<0||
    m>=100||
    variation<-100
  )return null;

  const cost=c.m*(1+variation/100)+c.l+c.g;

  if(!Number.isFinite(cost))return null;

  return{
    s,c,p,m,variation,cost,
    result:p-cost,
    margin:p>0?(p-cost)/p*100:null,
    suggested:Math.ceil(cost/(1-m/100))
  };
}

function simulate(){

  const s=active().find(s=>s.id===simId);
  const out=$('simResult');

  if(!s){

    out.innerHTML=`
      <div class="notice">
        Selecciona un servicio para comenzar.
      </div>
    `;

    return;
  }

  if(!calc(s).complete){

    out.innerHTML=`
      <div class="notice">
        Completa y revisa la ficha de costos
        antes de simular precios.
      </div>

      <button class="btn full"
        onclick="selected='${s.id}';go('fichas')">
        Completar ficha
      </button>
    `;

    return;
  }

  const d=simulationData();

  if(!d){

    out.innerHTML=`
      <div class="notice">Ingresa valores válidos.</div>
    `;

    return;
  }

  const {c,p,m,cost,result,margin,suggested}=d;

  out.innerHTML=card('Resultado de la simulación',`

    <div class="finance-list">

      ${financeRow(
        'simulador',
        'Precio actual',
        'Registrado en el catálogo',
        money(s.precio)
      )}

      ${financeRow(
        'sparkle',
        'Precio sugerido',
        'Para un margen de '+dec(m)+'%',
        money(suggested)
      )}

      ${financeRow(
        'coins',
        'Resultado estimado',
        'Con el precio simulado',
        money(result)
      )}

      ${financeRow(
        'percent',
        'Margen simulado',
        'Sobre el precio de venta',
        margin===null?'—':dec(margin)+'%'
      )}

    </div>

    ${totalCard(
      'Precio recomendado',
      money(suggested),
      'simulador'
    )}

    <button class="btn secondary full"
      onclick="$('simPrecio').value=${suggested};simulate()">
      Probar precio sugerido
    </button>

  `,'simulador')+card('Antes y después',`

    <div class="compare-grid">

      <div class="compare-card">

        <h3>Antes</h3>

        <div class="compare-subtitle">
          Precio actual
        </div>

        <div class="compare-line">
          <span>Precio</span>
          <strong>${money(s.precio)}</strong>
        </div>

        <div class="compare-line">
          <span>Costo</span>
          <strong>${money(c.t)}</strong>
        </div>

        <div class="compare-line">
          <span>Resultado</span>
          <strong>${money(c.r)}</strong>
        </div>

        <div class="compare-line">
          <span>Margen</span>
          <strong>
            ${c.margin===null?'—':dec(c.margin)+'%'}
          </strong>
        </div>

      </div>

      <div class="compare-card after">

        <h3>Después</h3>

        <div class="compare-subtitle">
          Precio simulado
        </div>

        <div class="compare-line">
          <span>Precio</span>
          <strong>${money(p)}</strong>
        </div>

        <div class="compare-line">
          <span>Costo</span>
          <strong>${money(cost)}</strong>
        </div>

        <div class="compare-line">
          <span>Resultado</span>
          <strong>${money(result)}</strong>
        </div>

        <div class="compare-line">
          <span>Margen</span>
          <strong>
            ${margin===null?'—':dec(margin)+'%'}
          </strong>
        </div>

      </div>

    </div>

    <div class="notice">

      ${result<0
        ?'El escenario genera una pérdida estimada.'
        :result===0
        ?'El precio cubre los costos sin margen positivo.'
        :'El escenario genera un resultado positivo estimado.'}

      <br>

      La variación de costos afecta únicamente los materiales.
      La simulación no modifica el precio real.

    </div>

    <button class="btn full"
      onclick="savePriceSimulation()">
      ${icon('save')}Guardar simulación
    </button>

  `);
}

function savePriceSimulation(){

  if(storageError)return;

  const d=simulationData();

  if(!d)return;

  db.simulaciones.unshift({

    id:uid(),
    fecha:now(),
    servicioId:d.s.id,
    servicio:d.s.nombre,
    precioActual:d.s.precio,
    precioSimulado:d.p,
    costoSimulado:d.cost,
    resultado:d.result,
    margen:d.margin,
    margenObjetivo:d.m,
    variacionMateriales:d.variation,
    precioSugerido:d.suggested

  });

  log('Simulación guardada: '+d.s.nombre);

  save('Simulación guardada correctamente');
}

function saveConfig(){

  if(storageError)return;

  db.config={

    margen:n('margen'),
    meta:n('meta'),
    inicio:val('inicioFecha'),
    revision:n('revision')

  };

  log('Actualización de objetivos financieros');

  save('Objetivos guardados');
  render();
}

function downloadFile(content,name,type){

  const a=document.createElement('a');

  const url=URL.createObjectURL(
    new Blob([content],{type})
  );

  a.href=url;
  a.download=name;

  document.body.appendChild(a);

  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function backup(){

  if(storageError){

    const raw=localStorage.getItem('tatiCostV1');

    if(raw){

      downloadFile(
        raw,
        'TATI_COST_Respaldo_Original.json',
        'application/json'
      );
    }

    return;
  }

  downloadFile(
    JSON.stringify(db,null,2),
    'TATI_COST_Respaldo.json',
    'application/json'
  );
}

function exportCSV(){

  const rows=[[
    'Servicio',
    'Categoria',
    'Precio',
    'Duracion',
    'Materiales',
    'Mano de obra',
    'Indirectos',
    'Costo total',
    'Resultado',
    'Margen (%)',
    'Estado'
  ]];

  active().forEach(s=>{

    const c=calc(s);

    rows.push([

      s.nombre,
      s.categoria,
      s.precio,
      s.tiempo,

      c.complete?Math.round(c.m):'',
      c.complete?Math.round(c.l):'',
      c.complete?Math.round(c.g):'',
      c.complete?Math.round(c.t):'',
      c.complete?Math.round(c.r):'',

      c.complete&&c.margin!==null
        ?c.margin.toFixed(2).replace('.',',')
        :'',

      ficha(s.id).estado

    ]);
  });

  const csv=rows.map(r=>r.map(v=>{

    let text=String(v);

    if(typeof v==='string'&&
      /^[=+\-@\t\r]/.test(text)
    ){
      text="'"+text;
    }

    return '"'+text.replace(/"/g,'""')+'"';

  }).join(';')).join('\r\n');

  downloadFile(
    '\uFEFF'+csv,
    'TATI_COST_Informe.csv',
    'text/csv;charset=utf-8'
  );
}

async function restore(e){

  try{

    if(!e.target.files.length)return;

    const d=migrate(
      JSON.parse(await e.target.files[0].text())
    );

    if(!valid(d))throw Error();

    if(confirm('¿Reemplazar los datos actuales con este respaldo?')){

      db=d;
      storageError=false;
      edit='';
      selected='';
      simId='';
      pendingPhoto=null;

      save('Respaldo importado');
      render();
    }

  }catch(err){

    alert('El respaldo no es válido o es incompatible.');

  }finally{

    e.target.value='';
  }
}

function resetData(){

  if(!confirm('¿Eliminar permanentemente todos los datos locales?'))return;

  if(!confirm('Esta acción no se puede deshacer sin un respaldo. ¿Continuar?'))return;

  db=fresh();
  storageError=false;
  edit='';
  selected='';
  simId='';
  pendingPhoto=null;

  save('Datos eliminados');
  render();
}

$('brand').innerHTML=icon('logo')+'<span>TATI COST</span>';
$('mobile').innerHTML=icon('menu');

render();

</script>
