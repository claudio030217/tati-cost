
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TATI COST | Studio Management</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f6f3ee;
--paper:#fffdf9;
--ink:#382f2a;
--muted:#887c73;
--accent:#a86c55;
--line:#e7ddd3;
--green:#66816d;
--red:#b95353;
--sand:#e9d6c3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:500}
h1{font-size:40px}
h2{font-size:27px}
h3{font-size:16px}
p{line-height:1.65}
aside{position:fixed;inset:0 auto 0 0;width:245px;background:#302822;color:#fff8ef;padding:30px 18px;overflow:auto}
.brand{font:39px 'Playfair Display',Georgia,serif;letter-spacing:-2px}
.eyebrow{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;color:var(--accent)}
aside .eyebrow{color:#c5a38e}
.navgroup{margin:28px 10px 10px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:7px;color:#d6c6b9;background:none;text-align:left;margin:3px 0}
.nav:hover,.nav.active{background:#58443a;color:#fff}
.nav svg,.ico{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
main{margin-left:245px;padding:30px 36px;max-width:1700px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:25px}
.hero{background:#ead8c5;display:grid;grid-template-columns:1.3fr 1fr;align-items:center;padding:35px;border-radius:12px;overflow:hidden;margin-bottom:25px}
.hero h1{font-size:clamp(32px,4vw,55px);line-height:1.1;margin:15px 0}
.hero p{max-width:450px;color:#745d4d;margin-bottom:20px}
.hero svg{width:100%;max-height:280px}
.btn{border:1px solid var(--ink);border-radius:6px;padding:11px 17px;background:var(--ink);color:white;font-weight:600}
.btn:hover{opacity:.82}
.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.danger{background:transparent;color:var(--red);border-color:#e7c4bd}
.small{padding:6px 9px;font-size:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin:18px 0}
.grid .card{margin:0}
.metric{font:33px 'Playfair Display',Georgia,serif;margin:12px 0}
.muted,small{color:var(--muted)}
.green{color:var(--green)}
.red{color:var(--red)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;margin:18px 0}
label{display:block;font-size:12px;font-weight:600;margin-bottom:7px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:5px;background:#fffefa;color:var(--ink)}
input:focus,select:focus{outline:2px solid #d9b7a4}
input[type=checkbox]{width:auto}
.tablewrap{overflow:auto;margin-top:15px}
table{border-collapse:collapse;width:100%;min-width:480px}
td,th{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
tr:hover td{background:#faf5ee}
.empty{text-align:center;color:var(--muted);padding:30px}
.empty svg{display:block;margin:0 auto 12px;width:45px;height:45px;color:var(--accent)}
.notice{background:#f0e5d8;border-left:3px solid var(--accent);padding:15px;margin:15px 0;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:5px 9px;background:#efe3d7;border-radius:4px;font-size:11px}
.ok{background:#e1e9dc;color:#527052}
.warn{background:#f4ded8;color:#a14b42}
.row{display:flex;align-items:center;gap:20px}
.ring{width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--accent) var(--pct),#eadfd3 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:115px;height:115px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:30px Georgia}
.bar{display:flex;height:14px;border-radius:5px;overflow:hidden;background:#eee5da;margin:16px 0}
.legend{display:flex;justify-content:space-between;margin:12px 0;gap:10px}
.alert{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.alert .ico{flex-shrink:0;color:var(--accent)}
.foot{border-top:1px solid #5d4c40;margin-top:30px;padding:20px 10px;color:#baa99a;font-size:11px;line-height:1.8}
#toast{position:fixed;bottom:20px;right:20px;display:none;background:var(--ink);color:white;padding:15px 20px;border-radius:6px;z-index:99}
#mobile{display:none}
.servicephoto{width:64px;height:64px;border-radius:7px;object-fit:cover;background:#ead9c8}
.servicehead{display:flex;align-items:center;gap:16px;margin:12px 0}
.search{max-width:320px;margin-top:15px}
.chartrow{margin:15px 0}
.charttrack{height:10px;background:#eee3d7;border-radius:5px;overflow:hidden;margin-top:6px}
.chartfill{height:100%;border-radius:5px;background:var(--green)}
@media(max-width:850px){
aside{position:relative;width:100%;padding:18px}
#mobile{display:block;float:right}
#navs{display:none}
#navs.open{display:block}
.foot{display:none}
main{margin:0;padding:18px}
.split{grid-template-columns:1fr}
.hero{padding:24px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric{font-size:27px}
.card{padding:16px}
}
@media(max-width:480px){
.hero{grid-template-columns:1fr}
.hero svg{max-height:200px}
.ring{width:110px;height:110px}
.ring span{width:90px;height:90px}
}
@media print{
aside,header,.btn,#toast,.noprint{display:none!important}
main{margin:0;padding:0}
body{background:white}
.card{break-inside:avoid;border:1px solid #ddd}
}
</style>
</head>
<body>

<aside>
<button id="mobile" class="btn" onclick="document.getElementById('navs').classList.toggle('open')">Menú</button>
<div class="brand">tati cost.</div>
<div class="eyebrow">Studio Management</div>
<nav id="navs"></nav>
<div class="foot">
TATI BEAUTY STUDIO<br>
Curicó, Chile<br><br>
Tu brújula financiera<br>
Versión 3.0
</div>
</aside>

<main>
<header>
<div>
<div class="eyebrow">Beauty Business Studio</div>
<h2 id="heading"></h2>
</div>
<span class="tag">Mi estudio</span>
</header>
<div id="content"></div>
</main>

<div id="toast" role="status"></div>

<script>
'use strict';

const $=id=>document.getElementById(id);
const money=n=>Number(n).toLocaleString('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
const dec=n=>Number(n).toLocaleString('es-CL',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const date=()=>new Date().toISOString();
const fmtdate=d=>d?new Date(d).toLocaleDateString('es-CL'):'Sin fecha';

const fresh=()=>({
 servicios:[],
 insumos:[],
 gastos:[],
 mano:{mensual:0,horas:0},
 baseHoras:0,
 fichas:{},
 config:{margen:30,meta:80,inicio:'',revision:30},
 historial:[]
});

let db=fresh();
let page='inicio';
let edit='';
let selected='';
let simId='';
let pendingPhoto=null;
let storageError=false;

function migrate(d){
 if(!d||!Array.isArray(d.servicios)||!Array.isArray(d.insumos)||!Array.isArray(d.gastos)||!d.mano||!d.fichas)throw Error('Formato inválido');
 d.config={...fresh().config,...d.config};
 d.historial=Array.isArray(d.historial)?d.historial:[];
 d.servicios=d.servicios.map(s=>({
  activo:true,
  preparacion:0,
  limpieza:0,
  foto:'',
  ...s,
  atencion:s.atencion??Math.max(0,s.tiempo-(s.preparacion||0)-(s.limpieza||0))
 }));
 d.insumos=d.insumos.map(i=>({
  proveedor:'',
  stock:null,
  minimo:null,
  historial:[],
  ...i
 }));
 return d;
}

function valid(d){
 const nn=x=>typeof x==='number'&&Number.isFinite(x)&&x>=0;
 const ids=a=>Array.isArray(a)&&a.every(x=>x&&typeof x.nombre==='string'&&typeof x.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(x.id))&&new Set(a.map(x=>x.id)).size===a.length;
 return d&&ids(d.servicios)&&ids(d.insumos)&&ids(d.gastos)&&
 d.servicios.every(s=>nn(s.precio)&&nn(s.tiempo)&&s.tiempo>0&&nn(s.preparacion)&&nn(s.atencion)&&nn(s.limpieza)&&typeof s.activo==='boolean'&&Math.abs(s.tiempo-s.preparacion-s.atencion-s.limpieza)<0.001)&&
 d.insumos.every(i=>nn(i.precio)&&nn(i.cantidad)&&i.cantidad>0&&['ml','g','unidad'].includes(i.unidad)&&(i.stock===null||nn(i.stock))&&(i.minimo===null||nn(i.minimo))&&Array.isArray(i.historial))&&
 d.gastos.every(g=>nn(g.monto))&&
 nn(d.mano.mensual)&&nn(d.mano.horas)&&nn(d.baseHoras)&&
 nn(d.config.margen)&&d.config.margen<100&&nn(d.config.meta)&&d.config.meta>0&&d.config.meta<=100&&nn(d.config.revision)&&d.config.revision>0&&
 Object.entries(d.fichas).every(([id,f])=>d.servicios.some(s=>s.id===id)&&f&&Array.isArray(f.materiales)&&typeof f.confirmados==='boolean'&&['En desarrollo','Revisado','Validado'].includes(f.estado)&&['Estimados','Parcialmente comprobados','Comprobados'].includes(f.calidad)&&f.materiales.every(m=>nn(m.cantidad)&&m.cantidad>0&&d.insumos.some(i=>i.id===m.insumo)));
}

try{
 const raw=localStorage.getItem('tatiCostV1');
 if(raw){
  const data=migrate(JSON.parse(raw));
  if(!valid(data))throw Error('Datos inválidos');
  db=data;
 }
}catch(e){
 storageError=true;
 console.error(e);
}

const paths={
 inicio:'<path d="M3 10l9-7 9 7v11H3zM9 21v-8h6v8"/>',
 servicios:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8 8l13 13M8 16L21 3"/>',
 insumos:'<path d="M3 7l9-4 9 4v13H3zM3 7l9 4 9-4M12 11v9"/>',
 mano:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',
 gastos:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 fichas:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M8 12l3 3 5-6"/>',
 simulador:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2m4 0h2M8 16h2m4 0h2"/>',
 rentabilidad:'<path d="M3 3v18h18M6 16l5-6 4 3 6-8"/>',
 asistente:'<path d="M9 18h6M10 22h4M8 15c-6-6-2-13 4-13s10 7 4 13l-1 3H9z"/>',
 informes:'<path d="M5 2h10l4 4v16H5zM14 2v6h5M8 12h8M8 16h8"/>',
 historial:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2M2 3v6h6"/>',
 config:'<circle cx="12" cy="12" r="4"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8l3 3M5 19l3-3m8-8l3-3"/>'
};

const icon=k=>`<svg class="ico" viewBox="0 0 24 24">${paths[k]||paths.fichas}</svg>`;

const names={
 inicio:'Vista general',
 servicios:'Mis servicios',
 insumos:'Productos e insumos',
 mano:'Mano de obra',
 gastos:'Gastos indirectos',
 fichas:'Fichas de costos',
 simulador:'Simulador financiero',
 rentabilidad:'Rentabilidad',
 asistente:'Asistente financiero',
 informes:'Informes',
 historial:'Historial',
 config:'Configuración'
};

const illustration=`
<svg viewBox="0 0 430 310" xmlns="http://www.w3.org/2000/svg">
<path d="M100 270V140a115 115 0 0 1 230 0v130Z" fill="#cda58d"/>
<ellipse cx="215" cy="274" rx="190" ry="13" fill="#a67b65" opacity=".25"/>
<rect x="116" y="116" width="72" height="155" rx="13" fill="#fff0dc" stroke="#98745d"/>
<rect x="132" y="90" width="40" height="30" rx="4" fill="#795646"/>
<path d="M147 90V70h42v8h-28v12" fill="#795646"/>
<rect x="126" y="160" width="52" height="69" fill="#d8b49e"/>
<text x="152" y="186" text-anchor="middle" font-family="Georgia" font-size="20" fill="#62493b">tati.</text>
<text x="152" y="203" text-anchor="middle" font-size="7" fill="#62493b">HAIR CARE</text>
<rect x="207" y="198" width="96" height="74" rx="8" fill="#a06c53"/>
<rect x="202" y="187" width="106" height="17" rx="4" fill="#65473a"/>
<rect x="219" y="222" width="72" height="30" fill="#ead5bb"/>
<text x="255" y="241" text-anchor="middle" font-family="Georgia" font-size="10" fill="#65473a">BEAUTY</text>
<g transform="translate(259 113) rotate(25)" fill="none" stroke="#6e5040" stroke-width="5" stroke-linecap="round">
<circle cx="-15" cy="29" r="12"/>
<circle cx="15" cy="29" r="12"/>
<path d="M-8 20L24-55M8 20L-24-55"/>
<circle cx="0" cy="0" r="3" fill="#6e5040"/>
</g>
<g fill="#9da489" stroke="#718064" stroke-width="1.5">
<path d="M85 270Q42 150 67 60" fill="none" stroke-width="2"/>
<path d="M60 110Q25 98 30 75Q56 81 60 110"/>
<path d="M58 146Q90 120 88 102Q61 109 58 146"/>
<path d="M64 181Q25 161 30 138Q59 145 64 181"/>
<path d="M74 217Q105 189 102 171Q78 178 74 217"/>
</g>
<g transform="translate(326 216) rotate(15)">
<rect width="30" height="58" rx="3" fill="#b88d72"/>
<path d="M5 0v-38M12 0v-38M19 0v-38M26 0v-38" stroke="#765544" stroke-width="3" stroke-linecap="round"/>
</g>
<g stroke="#fff6e8" stroke-width="2" fill="none">
<path d="M330 55v24M318 67h24M95 35v16M87 43h16M365 120v18M356 129h18"/>
</g>
</svg>`;

function toast(s){
 $('toast').textContent=s;
 $('toast').style.display='block';
 clearTimeout(window.tt);
 window.tt=setTimeout(()=>$('toast').style.display='none',2600);
}

function save(msg){
 if(storageError){
  alert('Existe un problema con los datos anteriores. Importa un respaldo válido antes de guardar.');
  return false;
 }
 try{
  localStorage.setItem('tatiCostV1',JSON.stringify(db));
  if(msg)toast(msg);
  return true;
 }catch(e){
  alert('No fue posible guardar. Revisa el espacio del navegador y descarga un respaldo.');
  return false;
 }
}

function log(text){
 db.historial.unshift({fecha:date(),texto:text});
 db.historial=db.historial.slice(0,500);
}

function go(p){
 page=p;
 edit='';
 pendingPhoto=null;
 render();
 $('navs').classList.remove('open');
 window.scrollTo(0,0);
}

function invalidate(id){
 Object.entries(db.fichas).forEach(([k,f])=>{
  if(!id||id===k)f.estado='En desarrollo';
 });
}

function invalidateInput(id){
 Object.entries(db.fichas).forEach(([k,f])=>{
  if(f.materiales.some(m=>m.insumo===id))f.estado='En desarrollo';
 });
}

const labor=()=>db.mano.horas?db.mano.mensual/(60*db.mano.horas):0;
const totalG=()=>db.gastos.reduce((a,g)=>a+g.monto,0);
const indirect=()=>db.baseHoras?totalG()/(60*db.baseHoras):0;
const active=()=>db.servicios.filter(s=>s.activo);
const ficha=id=>db.fichas[id]||{materiales:[],calidad:'Estimados',estado:'En desarrollo',confirmados:false};

function calc(s){
 const f=ficha(s.id);
 const m=f.materiales.reduce((a,r)=>{
  const i=db.insumos.find(i=>i.id===r.insumo);
  return a+(i?i.precio/i.cantidad*r.cantidad:0);
 },0);
 const l=labor()*s.tiempo;
 const g=indirect()*s.tiempo;
 const t=m+l+g;
 return{
  m,l,g,t,
  r:s.precio-t,
  margin:s.precio>0?(s.precio-t)/s.precio*100:null,
  complete:!!(f.confirmados&&db.mano.horas>0&&db.baseHoras>0&&f.materiales.every(r=>db.insumos.some(i=>i.id===r.insumo))&&['Revisado','Validado'].includes(f.estado))
 };
}

const completed=()=>active().filter(s=>calc(s).complete);

function card(title,body){
 return `<section class="card"><h3>${title}</h3>${body}</section>`;
}

function metric(label,value,k){
 return `<div class="card">${icon(k)}<div class="metric">${value}</div><small>${label}</small></div>`;
}

function table(heads,rows){
 return rows.length?`<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${icon('fichas')}Aún no hay registros disponibles.</div>`;
}

function field(label,id,type='text',v='',attrs=''){
 return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(v)}" ${attrs}></div>`;
}

function select(label,id,opts,v=''){
 return `<div><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>{
 const [k,t]=Array.isArray(o)?o:[o,o];
 return `<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(t)}</option>`;
 }).join('')}</select></div>`;
}

function form(body,action,label='Guardar'){
 return `<form onsubmit="event.preventDefault();${esc(action)}"><div class="formgrid">${body}</div><div class="actions"><button class="btn">${label}</button><button type="button" class="btn secondary" onclick="edit='';pendingPhoto=null;render()">Cancelar</button></div></form>`;
}

const val=id=>$(id).value;
const n=id=>Number(val(id));
const serviceOpts=()=>[['','Seleccionar servicio'],...active().map(s=>[s.id,s.nombre])];

function buttons(id){
 return `<button class="btn secondary small" onclick="edit='${id}';pendingPhoto=null;render();window.scrollTo(0,0)">Editar</button> <button class="btn danger small" onclick="remove('${id}')">Eliminar</button>`;
}

function nav(){
 const groups=[
 ['Mi estudio',['inicio']],
 ['Administración',['servicios','insumos','mano','gastos']],
 ['Finanzas',['fichas','simulador','rentabilidad','asistente']],
 ['Seguimiento',['informes','historial','config']]
 ];
 $('navs').innerHTML=groups.map(([title,items])=>`<div class="navgroup eyebrow">${title}</div>${items.map(k=>`<button class="nav ${page===k?'active':''}" onclick="go('${k}')">${icon(k)}${names[k]}</button>`).join('')}`).join('');
}

function costChart(ss){
 const a=ss.reduce((a,s)=>{
  const c=calc(s);
  return[a[0]+c.m,a[1]+c.l,a[2]+c.g];
 },[0,0,0]);
 const t=a.reduce((x,y)=>x+y,0);
 const colors=['#a86c55','#d6ad91','#66816d'];
 if(!t)return `<div class="empty">${icon('rentabilidad')}Sin costos disponibles.</div>`;
 return `<div class="bar">${a.map((v,j)=>`<div style="width:${v/t*100}%;background:${colors[j]}"></div>`).join('')}</div>${a.map((v,j)=>`<div class="legend"><span><span style="color:${colors[j]}">●</span> ${['Materiales','Mano de obra','Indirectos'][j]}</span><strong>${money(v)}</strong></div>`).join('')}`;
}

function alerts(){
 const a=[];
 active().forEach(s=>{
  const c=calc(s);
  const f=ficha(s.id);
  if(!c.complete){
   a.push({title:'Ficha pendiente',text:s.nombre+' necesita completar o revisar sus costos.',page:'fichas',id:s.id});
  }else{
   if(c.r<0)a.push({title:'Servicio con pérdida estimada',text:s.nombre+': resultado '+money(c.r)+'.',page:'fichas',id:s.id});
   else if(c.margin!==null&&c.margin<db.config.margen)a.push({title:'Margen inferior al objetivo',text:s.nombre+': '+dec(c.margin)+'%. Precio sugerido: '+money(Math.ceil(c.t/(1-db.config.margen/100)))+'.',page:'fichas',id:s.id});
   if(f.actualizado&&Date.now()-new Date(f.actualizado).getTime()>db.config.revision*86400000)a.push({title:'Revisión de costos pendiente',text:s.nombre+' supera el intervalo de revisión configurado.',page:'fichas',id:s.id});
  }
 });
 db.insumos.forEach(i=>{
  if(i.stock!==null&&i.minimo!==null&&i.stock<=i.minimo)a.push({title:'Stock bajo',text:i.nombre+': '+dec(i.stock)+' '+i.unidad+' disponibles.',page:'insumos',id:i.id});
  const last=i.historial[0];
  if(last&&last.nuevo>last.anterior)a.push({title:'Aumento de costo unitario',text:i.nombre+': '+(last.anterior>0?dec((last.nuevo/last.anterior-1)*100)+'% de aumento.':'nuevo costo superior al anterior.'),page:'insumos',id:i.id});
 });
 return a;
}

async function readPhoto(e){
 const file=e.target.files[0];
 if(!file)return;
 if(file.size>3*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){
  alert('Selecciona una imagen JPG, PNG o WebP de hasta 3 MB.');
  return;
 }
 const status=$('photoStatus');
 status.textContent='Procesando fotografía...';
 try{
  const url=URL.createObjectURL(file);
  const img=new Image();
  await new Promise((resolve,reject)=>{
   img.onload=resolve;
   img.onerror=reject;
   img.src=url;
  });
  URL.revokeObjectURL(url);
  const canvas=document.createElement('canvas');
  const scale=Math.min(1,500/Math.max(img.width,img.height));
  canvas.width=Math.max(1,Math.round(img.width*scale));
  canvas.height=Math.max(1,Math.round(img.height*scale));
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  if(status.isConnected){
   pendingPhoto=canvas.toDataURL('image/jpeg',.75);
   status.textContent='Fotografía preparada. Guarda el servicio.';
  }
 }catch(err){
  status.textContent='No fue posible procesar la imagen.';
 }
}

function store(){
 const id=edit||uid();
 const name=val('nombre').trim();
 if(!name){alert('Ingresa un nombre válido.');return}
 const old=db[page].find(x=>x.id===id);
 let x={...old,id,nombre:name};

 if(page==='servicios'){
  const prep=n('preparacion');
  const att=n('atencion');
  const clean=n('limpieza');
  if(prep+att+clean<=0){alert('La duración total debe ser mayor que cero.');return}
  Object.assign(x,{
   categoria:val('categoria'),
   precio:n('precio'),
   preparacion:prep,
   atencion:att,
   limpieza:clean,
   tiempo:prep+att+clean,
   activo:val('activo')==='true',
   foto:pendingPhoto!==null?pendingPhoto:old?.foto||''
  });
  if(old&&(old.precio!==x.precio||old.tiempo!==x.tiempo))invalidate(id);
 }

 if(page==='insumos'){
  Object.assign(x,{
   proveedor:val('proveedor').trim(),
   precio:n('precio'),
   cantidad:n('cantidad'),
   unidad:val('unidad'),
   stock:val('stock')===''?null:n('stock'),
   minimo:val('minimo')===''?null:n('minimo'),
   historial:old?.historial||[]
  });
  if(old&&old.unidad!==x.unidad&&Object.values(db.fichas).some(f=>f.materiales.some(m=>m.insumo===id))){
   alert('Retira el producto de las fichas antes de cambiar su unidad.');
   return;
  }
  if(old){
   const anterior=old.precio/old.cantidad;
   const nuevo=x.precio/x.cantidad;
   if(old.unidad===x.unidad&&anterior!==nuevo){
    x.historial.unshift({fecha:date(),anterior,nuevo});
    invalidateInput(id);
   }
   if(old.unidad!==x.unidad)x.historial=[];
  }
 }

 if(page==='gastos'){
  Object.assign(x,{monto:n('monto'),tipo:val('tipo')});
  invalidate();
 }

 const j=db[page].findIndex(x=>x.id===id);
 if(j<0)db[page].push(x);
 else db[page][j]=x;
 log((old?'Actualización: ':'Nuevo registro: ')+name);
 edit='';
 pendingPhoto=null;
 save('Registro guardado');
 render();
}

function remove(id){
 if(page==='insumos'&&Object.values(db.fichas).some(f=>f.materiales.some(m=>m.insumo===id))){
  alert('Este producto está asociado a una ficha de costos.');
  return;
 }
 const x=db[page].find(x=>x.id===id);
 if(!x||!confirm('¿Eliminar '+x.nombre+'?'))return;
 db[page]=db[page].filter(x=>x.id!==id);
 if(page==='servicios'){
  delete db.fichas[id];
  if(selected===id)selected='';
  if(simId===id)simId='';
 }
 if(page==='gastos')invalidate();
 log('Registro eliminado: '+x.nombre);
 edit='';
 save('Registro eliminado');
 render();
}

  return;
 }
 if(estado==='Validado'&&calidad!=='Comprobados'){
  alert('La validación requiere datos comprobados.');
  return;
 }
 Object.assign(f,{estado,calidad,confirmados,actualizado:date()});
 db.fichas[selected]=f;
 log('Ficha '+estado.toLowerCase()+': '+db.servicios.find(s=>s.id===selected).nombre);
 save('Ficha guardada');
 render();
}

function simulate(){
 const s=active().find(s=>s.id===simId);
 const out=$('simResult');
 if(!s){
  out.innerHTML='<div class="notice">Selecciona un servicio.</div>';
  return;
 }
 const c=calc(s);
 if(!c.complete){
  out.innerHTML='<div class="notice">Completa y revisa la ficha antes de simular precios.</div>';
  return;
 }
 const p=n('simPrecio');
 const m=n('simMargen');
 const variation=n('simCosto');
 if(['simPrecio','simMargen','simCosto'].some(id=>val(id)==='')||![p,m,variation].every(Number.isFinite)||p<0||m<0||m>=100||variation<-100){
  out.innerHTML='<div class="notice">Ingresa valores válidos.</div>';
  return;
 }
 const newCost=c.m*(1+variation/100)+c.l+c.g;
 const newMargin=p>0?(p-newCost)/p*100:null;
 const suggested=Math.ceil(newCost/(1-m/100));

 out.innerHTML=`<div class="grid">${metric('Costo simulado',money(newCost),'fichas')}${metric('Resultado simulado',money(p-newCost),'rentabilidad')}${metric('Margen simulado',newMargin===null?'—':dec(newMargin)+'%','rentabilidad')}${metric('Precio para margen deseado',money(suggested),'simulador')}</div>`+
 card('Comparación de escenarios',table(['Concepto','Actual','Simulado'],[
  ['Precio',money(s.precio),money(p)],
  ['Materiales',money(c.m),money(c.m*(1+variation/100))],
  ['Costo total',money(c.t),money(newCost)],
  ['Resultado',money(c.r),money(p-newCost)],
  ['Margen',c.margin===null?'—':dec(c.margin)+'%',newMargin===null?'—':dec(newMargin)+'%']
 ]))+card('Interpretación',`<br><p>${p<newCost?'El escenario genera una pérdida estimada.':p===newCost?'El escenario cubre los costos sin margen positivo.':'El escenario genera un resultado positivo estimado.'}</p><br><small>La variación aplicada afecta únicamente los materiales. No modifica los datos registrados.</small>`);
}

function saveConfig(){
 db.config={
  margen:n('margen'),
  meta:n('meta'),
  inicio:val('inicioFecha'),
  revision:n('revision')
 };
 log('Actualización de objetivos financieros');
 save('Objetivos guardados');
 render();
}

function downloadFile(content,name,type){
 const a=document.createElement('a');
 const url=URL.createObjectURL(new Blob([content],{type}));
 a.href=url;
 a.download=name;
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function backup(){
 if(storageError){
  const raw=localStorage.getItem('tatiCostV1');
  if(raw)downloadFile(raw,'TATI_COST_Respaldo_Original.json','application/json');
  return;
 }
 downloadFile(JSON.stringify(db,null,2),'TATI_COST_Respaldo.json','application/json');
}

function exportCSV(){
 const rows=[['Servicio','Categoria','Precio','Duracion','Materiales','Mano de obra','Indirectos','Costo total','Resultado','Margen (%)','Estado']];
 active().forEach(s=>{
  const c=calc(s);
  rows.push([
   s.nombre,s.categoria,s.precio,s.tiempo,
   c.complete?Math.round(c.m):'',
   c.complete?Math.round(c.l):'',
   c.complete?Math.round(c.g):'',
   c.complete?Math.round(c.t):'',
   c.complete?Math.round(c.r):'',
   c.complete&&c.margin!==null?c.margin.toFixed(2).replace('.',','):'',
   ficha(s.id).estado
  ]);
 });
 const csv=rows.map(r=>r.map(v=>{
  let text=String(v);
  if(typeof v==='string'&&/^[=+\-@\t\r]/.test(text))text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
 }).join(';')).join('\r\n');
 downloadFile('\uFEFF'+csv,'TATI_COST_Informe.csv','text/csv;charset=utf-8');
}

function printFicha(){
 window.print();
}

async function restore(e){
 try{
  if(!e.target.files.length)return;
  const d=migrate(JSON.parse(await e.target.files[0].text()));
  if(!valid(d))throw Error();
  if(confirm('¿Reemplazar los datos actuales con este respaldo?')){
   db=d;
   storageError=false;
   edit='';
   selected='';
   simId='';
   pendingPhoto=null;
   save('Respaldo importado');
   render();
  }
 }catch(err){
  alert('El respaldo no es válido o es incompatible.');
 }
}

function resetData(){
 if(!confirm('¿Eliminar permanentemente todos los datos locales?'))return;
 if(!confirm('Esta acción no se puede deshacer sin un respaldo. ¿Continuar?'))return;
 db=fresh();
 storageError=false;
 edit='';
 selected='';
 simId='';
 pendingPhoto=null;
 save('Datos eliminados');
 render();
}

render();
</script>
